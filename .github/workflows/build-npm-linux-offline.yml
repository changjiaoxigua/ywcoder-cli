name: Build NPM Linux Offline Package

on:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-npm-offline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine build channel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_CHANNEL=release
            VERSION_SUFFIX=""
          else
            BUILD_CHANNEL=dev
            VERSION_SUFFIX="-dev.${GITHUB_SHA::7}"
          fi
          echo "BUILD_CHANNEL=$BUILD_CHANNEL" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV

          # 从 package.json 读取基础版本号，拼接完整显示版本
          BASE_VERSION=$(node -p "require('./package.json').version")
          DISPLAY_VERSION="${BASE_VERSION}${VERSION_SUFFIX}"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "构建通道: $BUILD_CHANNEL, 显示版本: $DISPLAY_VERSION"

      - name: Set up Node.js 18.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: npm install

      - name: Build
        run: bun run build

      - name: Download ripgrep for Linux only
        run: |
          # 创建 Linux x64 目录结构
          mkdir -p vendor/ripgrep/x64-linux

          # 下载 Linux x64 ripgrep
          RG_VERSION="14.1.0"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "正在下载 ripgrep ${RG_VERSION} for Linux x64..."
          curl -fsSL -o rg-linux.tar.gz "${RG_URL}"

          # 解压并提取 rg 二进制文件
          mkdir -p rg-temp
          tar -xzf rg-linux.tar.gz -C rg-temp
          RG_BIN=$(find rg-temp -name "rg" -type f | head -n 1)
          if [ -n "${RG_BIN}" ]; then
            cp "${RG_BIN}" vendor/ripgrep/x64-linux/rg
            chmod +x vendor/ripgrep/x64-linux/rg
            echo "已找到并复制 rg: ${RG_BIN}"
          else
            echo "错误：未在解压目录中找到 rg 二进制文件"
            exit 1
          fi
          rm -f rg-linux.tar.gz
          rm -rf rg-temp

          echo "已下载 ripgrep for Linux x64"

          # 显示 vendor 目录结构
          echo "Vendor 目录结构："
          find vendor/ -type f

      - name: Copy vendor to dist for ripgrep path resolution
        run: |
          # ripgrep.ts 期望 vendor 位于 dist/vendor/ripgrep
          # 将 vendor 目录复制到 dist/ 使路径解析正常工作
          cp -r vendor dist/vendor
          echo "已将 vendor 复制到 dist/ 目录"
          find dist/vendor/ -type f

      - name: Prepare minimal node_modules for offline packing
        run: node scripts/prepare-offline-pack.mjs

      - name: Pack npm package
        run: npm pack --ignore-scripts

      - name: Rename package with version and platform
        run: |
          ARTIFACT_NAME="ywcoder-${DISPLAY_VERSION}-linux-x64.tgz"
          mv dcywzc-ywcoder-*.tgz "$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "产物文件: $ARTIFACT_NAME"
          ls -lh "$ARTIFACT_NAME" | awk '{printf "%s  %.2f MB\n", $NF, $5/1024/1024}'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ywcoder-${{ env.DISPLAY_VERSION }}-linux-x64
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: ${{ env.ARTIFACT_NAME }}

      - name: Show install instructions
        run: |
          echo ""
          echo "========================================"
          echo "离线安装包构建成功！"
          echo "========================================"
          echo ""
          echo "版本: ${DISPLAY_VERSION} (通道: ${BUILD_CHANNEL})"
          echo ""
          echo "在离线 Linux 环境中安装方式："
          echo "  npm install -g ${ARTIFACT_NAME}"
          echo ""
