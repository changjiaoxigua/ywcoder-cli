name: Build NPM Windows Offline Package

on:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-npm-offline:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine build channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_CHANNEL=release
            VERSION_SUFFIX=""
          else
            BUILD_CHANNEL=dev
            VERSION_SUFFIX="-dev.${GITHUB_SHA::7}"
          fi
          echo "BUILD_CHANNEL=$BUILD_CHANNEL" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV

          # 从 package.json 读取基础版本号，拼接完整显示版本
          BASE_VERSION=$(node -p "require('./package.json').version")
          DISPLAY_VERSION="${BASE_VERSION}${VERSION_SUFFIX}"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "构建通道: $BUILD_CHANNEL, 显示版本: $DISPLAY_VERSION"

      - name: Set up Node.js 18.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: npm install

      - name: Build
        run: bun run build

      - name: Download ripgrep for Windows only
        run: |
          # Create vendor/ripgrep directory structure for Windows only
          New-Item -ItemType Directory -Force -Path "vendor/ripgrep/x64-win32"

          # Download Windows x64 ripgrep
          $rgVersion = "14.1.0"
          $rgUrl = "https://github.com/BurntSushi/ripgrep/releases/download/$rgVersion/ripgrep-$rgVersion-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $rgUrl -OutFile "rg-windows.zip"
          New-Item -ItemType Directory -Force -Path "rg-temp"
          Expand-Archive -Path "rg-windows.zip" -DestinationPath "rg-temp"
          # Find rg.exe in the extracted directory (might be in a subdirectory)
          $rgExe = Get-ChildItem -Path "rg-temp" -Filter "rg.exe" -Recurse | Select-Object -First 1
          if ($rgExe) {
              Copy-Item -Path $rgExe.FullName -Destination "vendor/ripgrep/x64-win32/rg.exe"
              Write-Host "Found rg.exe at: $($rgExe.FullName)"
          } else {
              Write-Error "rg.exe not found in extracted archive"
              exit 1
          }
          Remove-Item -Path "rg-windows.zip" -Force
          Remove-Item -Path "rg-temp" -Recurse -Force

          Write-Host "Downloaded ripgrep for Windows x64"

          # Show vendor directory structure
          Write-Host "Vendor directory structure:"
          Get-ChildItem -Recurse vendor/

      - name: Copy vendor to dist for ripgrep path resolution
        run: |
          # ripgrep.ts expects vendor at dist/vendor/ripgrep
          # Copy vendor directory to dist/ so the path resolution works
          Copy-Item -Path "vendor" -Destination "dist/vendor" -Recurse -Force
          Write-Host "Copied vendor to dist/ directory"
          Get-ChildItem -Recurse dist/vendor/

      - name: Prepare minimal node_modules for offline packing
        run: node scripts/prepare-offline-pack.mjs

      - name: Pack npm package
        run: npm pack --ignore-scripts

      - name: Rename package with version and platform
        shell: bash
        run: |
          ARTIFACT_NAME="ywcoder-${DISPLAY_VERSION}-win-x64.tgz"
          mv dcywzc-ywcoder-*.tgz "$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "产物文件: $ARTIFACT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ywcoder-${{ env.DISPLAY_VERSION }}-win-x64
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: ${{ env.ARTIFACT_NAME }}

      - name: Show install instructions
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Offline package created successfully!"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Version: $env:DISPLAY_VERSION (Channel: $env:BUILD_CHANNEL)"
          Write-Host ""
          Write-Host "Install with:"
          Write-Host "  npm install -g $env:ARTIFACT_NAME"
          Write-Host ""
