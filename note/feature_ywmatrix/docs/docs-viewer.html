      --bg-body: #161412;
      --bg-card: #1f1c19;
      --text-main: #e8e4df;
      --text-muted: #9e9993;
      --accent: #e87a3e;
      --accent-light: #3d2a1f;
      --border: #36312c;
      --sidebar: #1c1916;
      --code-bg: #13110f;
    }
    body { font-family: 'DM Sans', 'Noto Serif SC', sans-serif; background: var(--bg-body); color: var(--text-main); }
    h1, h2, h3, h4 { font-family: 'Noto Serif SC', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .doc-content h1 { font-size: 2rem; font-weight: 700; margin: 1.5rem 0 1rem; color: var(--accent); }
    .doc-content h2 { font-size: 1.5rem; font-weight: 600; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
    .doc-content h3 { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .doc-content h4 { font-size: 1.1rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
    .doc-content p { margin: 0.75rem 0; line-height: 1.8; }
    .doc-content ul, .doc-content ol { margin: 0.75rem 0; padding-left: 1.5rem; line-height: 1.8; }

    .doc-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .doc-content blockquote { border-left: 4px solid var(--accent); background: var(--accent-light); padding: 0.75rem 1rem; margin: 1rem 0; border-radius: 0 0.5rem 0.5rem 0; }
    .doc-content pre { background: var(--code-bg); color: #d4d4d4; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
    .doc-content code { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
    .doc-content p code, .doc-content li code { background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.35rem; border-radius: 0.25rem; }
    .doc-content pre code { background: transparent; color: inherit; padding: 0; }
    .doc-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.95rem; }
    .doc-content th, .doc-content td { border: 1px solid var(--border); padding: 0.6rem 0.8rem; text-align: left; }

  <script>
    const DOCS = [

  {
    "id": "architecture",
    "title": "架构设计",
    "subtitle": "系统总体架构与组件职责",
    "status": "completed",
    "statusLabel": "Completed",
    "content": "# 架构设计\n\n## 1. 设计目标\n\n本系统用于**统一远程管理运行在员工终端上的各类 Agent**（编码、办公、值班等）。核心诉求：\n\n- 用户通过浏览器即可查看在线 Agent 并与其对话\n- 每个 Agent 属于特定用户，用户只能管理自己的 Agent\n- Agent 运行在员工内网终端，不需要暴露公网端口\n- 支持跨平台终端（Windows、Linux、麒麟桌面）\n- 实时双向通信，支持流式返回\n\n## 2. 总体架构\n\n```text\n┌─────────────────────────────────────────────────────────────────┐\n│                          用户浏览器                              │\n│                      http://gateway.internal:8080               │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │ WebSocket\n                            │ /ws/admin\n┌───────────────────────────▼─────────────────────────────────────┐\n│                          统一网关 (gateway)                      │\n│  - 维护 AgentClient 连接注册表                                   │\n│  - 维护用户页面连接                                              │\n│  - 按 agent_id 路由消息                                          │\n│  - 提供静态管理页面                                              │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │ WebSocket\n                            │ /ws/agent?agent_id=xxx\n        ┌───────────────────┼───────────────────┐\n        │                   │                   │\n┌───────▼──────┐    ┌───────▼──────┐    ┌───────▼──────┐\n│  员工终端 A   │    │  员工终端 B   │    │  员工终端 C   │\n│ AgentClient  │    │ AgentClient  │    │ AgentClient  │\n│   (client)   │    │   (client)   │    │   (client)   │\n│              │    │              │    │              │\n│  HTTPAdapter │    │  StdioAdapter│    │  HTTPAdapter │\n│     or       │    │     or       │    │     or       │\n│  StdioAdapter│    │  HTTPAdapter │    │  StdioAdapter│\n└───────┬──────┘    └───────┬──────┘    └───────┬──────┘\n        │                   │                   │\n        │ HTTP + SSE        │ stdin/stdout      │ HTTP + SSE\n        │ /capabilities     │ JSON lines        │ /capabilities\n        │ /tasks            │                   │ /tasks\n┌───────▼──────┐    ┌───────▼──────┐    ┌───────▼──────┐\n│ 本地 Coding  │    │  本地 Office │    │  本地 Oncall │\n│    Agent     │    │    Agent     │    │    Agent     │\n│ （已有产品）  │    │ （命令行）   │    │ （已有产品）  │\n└──────────────┘    └──────────────┘    └──────────────┘\n```\n\n## 3. 核心组件职责\n\n### 3.1 Gateway（网关）\n\n网关是系统的控制中心，通常部署在内网服务器上。\n\n职责：\n- 接收用户页面的 WebSocket 连接，认证并识别用户身份\n- 接收终端 AgentClient 的 WebSocket 连接，绑定 Agent 到所属用户\n- 维护 Agent 在线列表和能力清单\n- 按用户权限过滤 Agent 列表\n- 根据 `agent_id` 把用户消息路由到对应终端，并校验操作权限\n- 把 Agent 的流式响应转发给所有在线用户页面\n- 提供静态管理页面 `static/index.html`\n\n### 3.2 AgentClient（终端客户端）\n\nAgentClient 是跑在员工终端上的常驻后台程序，本质上是一个**本地 Agent 适配器**。\n\n职责：\n- 主动连接网关（只开 outbound，不监听外部端口）\n- 携带用户 Token 进行认证\n- 通过适配器上报本地 Agent 能力列表和所属用户\n- 接收网关转发的用户指令\n- 把指令转发给本地 Agent（HTTP 或 stdio）\n- 把本地 Agent 的流式响应回传给网关\n- 维持心跳，断线自动重连\n\nAgentClient 内置适配器：\n- **HTTPAdapter**：与本地 Agent 通过 HTTP + SSE 通信\n- **StdioAdapter**：把本地 Agent 作为子进程启动，通过 stdin/stdout JSON lines 通信\n\n### 3.3 本地 Agent\n\n本地 Agent 是实际干活的程序，部署在员工终端上，与 AgentClient 同机运行。它**不感知网关协议**，只按约定格式与 AgentClient 交互。\n\n本地 Agent 可以是：\n- 一个已有产品（如 Claude Code 类代码 Agent）\n- 一个 Python/FastAPI HTTP 服务\n- 一个命令行交互式程序（stdio）\n- 任何能提供约定输入输出接口的程序\n\nAgentClient 的适配器层把不同形态的本地 Agent 统一成同一套网关协议。\n\n## 4. 通信机制\n\n### 4.1 三层通信链路\n\n| 链路 | 协议 | 方向 | 用途 |\n|------|------|------|------|\n| 浏览器 ↔ 网关 | WebSocket | 双向 | 用户发指令、接收流式结果 |\n| 网关 ↔ AgentClient | WebSocket | 双向 | 指令下发、结果上传 |\n| AgentClient ↔ 本地 Agent | HTTP + SSE | 请求/流式响应 | 调用本地能力 |\n\n### 4.2 为什么用 WebSocket\n\n- **全双工**：用户发送指令后，Agent 可以实时推送进度和结果\n- **有状态连接**：网关知道哪个 Agent 在线、掉线\n- **浏览器原生支持**：管理页面直接用浏览器 WebSocket API\n\n### 4.3 为什么 AgentClient 要主动连网关\n\n员工终端通常处于内网、NAT 或防火墙后，无法被外部直接访问。让 AgentClient **主动 outbound 连接网关**：\n\n- 不需要在员工电脑上开端口\n- 不受 DHCP、换网、VPN 影响\n- 网关只需要一个固定内网地址\n- 本地 Agent 不需要具备网络连接能力\n\n### 4.4 为什么 AgentClient 要加适配器层\n\n不同本地 Agent 形态各异：有的是 HTTP 服务，有的是命令行程序，有的甚至有自己的 GUI。让 AgentClient 承担适配器角色：\n\n- **本地 Agent 零侵入**：已有产品不需要改网络代码\n- **统一远程协议**：网关和页面只认一种消息格式\n- **灵活扩展**：新增一种本地 Agent，只需新增一个适配器\n- **安全隔离**：AgentClient 可以做本地确认、命令白名单，网关不直接访问 Agent\n\n### 4.5 本地 Agent 通信方式\n\nAgentClient 目前支持两种本地通信方式：\n\n| 方式 | 适用场景 | 优点 | 缺点 |\n|------|---------|------|------|\n| HTTP + SSE | 本地 Agent 是 HTTP 服务 | 跨平台、语言无关、调试方便 | 多一个本地端口 |\n| stdin/stdout JSON lines | 本地 Agent 是命令行程序 | 无需端口、启动即连 | 一次只能处理一个请求 |\n\n选择哪种方式由本地 Agent 的形态决定，AgentClient 通过 `-adapter` 参数指定。\n\n## 5. 消息协议\n\n所有 WebSocket 消息采用 **JSON-RPC 2.0** 格式，详见 [docs/protocol.md](protocol.md)。下面是简化示意。\n\n### 5.1 Agent 注册\n\nAgentClient 连接网关后，立即发送注册消息：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"reg-1\",\n  \"method\": \"system.register\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"capabilities\": [\n      {\"type\": \"chat\", \"name\": \"coding\", \"description\": \"编码助手\"}\n    ]\n  }\n}\n```\n\n网关收到后更新 Agent 列表，并广播给用户页面：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"admin.agentList\",\n  \"params\": {\n    \"agents\": [\n      {\"id\": \"demo-mac\", \"capabilities\": [{\"type\": \"chat\", \"name\": \"coding\", \"description\": \"编码助手\"}]}\n    ]\n  }\n}\n```\n\n### 5.2 用户发送指令\n\n用户在页面选择 Agent 并发送消息：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-1\",\n  \"method\": \"task.create\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"type\": \"chat\",\n    \"content\": \"帮我执行一个任务\"\n  }\n}\n```\n\n### 5.3 Agent 流式响应\n\nAgentClient 把本地 Agent 的流式输出转换为 `$/progress` 通知，逐条转发：\n\n```json\n{\"jsonrpc\": \"2.0\", \"method\": \"$/progress\", \"params\": {\"token\": \"task-001\", \"value\": {\"agent_id\": \"demo-mac\", \"session_id\": \"session-001\", \"content\": [{\"type\": \"text\", \"text\": \"收到指令\"}], \"done\": false}}}\n{\"jsonrpc\": \"2.0\", \"method\": \"$/progress\", \"params\": {\"token\": \"task-001\", \"value\": {\"agent_id\": \"demo-mac\", \"session_id\": \"session-001\", \"content\": [{\"type\": \"text\", \"text\": \"！\"}], \"done\": true}}}\n```\n\n`session_id` 用于把响应和请求对应起来。\n\n### 5.4 本地 Agent HTTP 接口\n\nAgentClient 向本地 Agent 发送 POST 请求：\n\n```http\nPOST /tasks\nContent-Type: application/json\n\n{\"task_id\": \"task-001\", \"session_id\": \"session-001\", \"type\": \"chat\", \"content\": \"帮我执行一个任务\"}\n```\n\n本地 Agent 返回 SSE 流，每个 `data:` 行是一条 JSON-RPC 通知：\n\n```http\nHTTP/1.1 200 OK\nContent-Type: text/event-stream\nConnection: keep-alive\n\ndata: {\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"text\", \"content\": [{\"type\": \"text\", \"text\": \"收到指令\"}]}}\n\ndata: {\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"text\", \"content\": [{\"type\": \"text\", \"text\": \"！\"}], \"done\": true}}\n```\n\n## 6. 消息路由流程\n\n以用户给 `demo-mac` 发送消息为例：\n\n```text\n1. 用户在浏览器输入消息\n        │\n        ▼\n2. 浏览器通过 WebSocket 发送给网关\n        │ {\"jsonrpc\":\"2.0\",\"id\":\"req-1\",\"method\":\"task.create\",\"params\":{\"agent_id\":\"demo-mac\",\"session_id\":\"...\",\"content\":\"...\"}}\n        ▼\n3. 网关根据 agent_id 查找 demo-mac 的 WebSocket 连接\n        │\n        ▼\n4. 网关把消息转发给 demo-mac 上的 AgentClient\n        │ {\"jsonrpc\":\"2.0\",\"id\":\"req-1\",\"method\":\"agent.chat\",\"params\":{...}}\n        ▼\n5. AgentClient 解析消息，转发给本地 Agent 的 /tasks 接口\n        │ HTTP POST\n        ▼\n6. 本地 Agent 流式返回 SSE\n        │\n        ▼\n7. AgentClient 把每个 SSE chunk 转成 `$/progress` 通知发回网关\n        │\n        ▼\n8. 网关把响应转发给所有在线用户页面\n        │\n        ▼\n9. 浏览器实时显示流式结果\n```\n\n## 7. 连接生命周期\n\n### 7.1 AgentClient 连接\n\n```text\n启动 ──► 连接网关 WebSocket ──► 发送 system.register ──► 网关广播 admin.agentList\n                              │\n                              ├── 心跳保活（system.heartbeat）\n                              ├── 接收 agent.chat 指令\n                              └── 断线后重连\n```\n\n### 7.2 用户页面连接\n\n```text\n打开页面 ──► 连接 /ws/admin ──► 收到 admin.agentList ──► 选择 Agent 对话\n                              │\n                              ├── 发送 task.create\n                              └── 接收 admin.task.progress / $/progress 流\n```\n\n### 7.3 掉线处理\n\n- AgentClient 断线：网关从注册表移除，广播新的 admin.agentList\n- 用户页面断线：网关从用户列表移除，不再向该页面推送\n- 消息不持久化：Demo 版本离线消息会丢失，生产环境需要加消息队列\n\n## 8. 并发模型\n\n### 8.1 网关\n\n- 每个 Agent 连接一个读 goroutine + 一个写 goroutine\n- 每个用户连接一个读 goroutine + 一个写 goroutine\n- 通过 `Send` channel 解耦读写，避免直接写阻塞\n- 注册表用 `sync.RWMutex` 保护\n\n### 8.2 AgentClient\n\n- 主 goroutine 读取网关消息\n- 每个 `chat` 任务启动一个 goroutine 调用本地 Agent\n- 本地 Agent 的 SSE 流在 goroutine 中读取，并发回网关\n- WebSocket 写操作加互斥锁，防止并发写冲突\n\n## 9. 安全设计（Demo 版本与生产建议）\n\n### 9.1 Demo 版本已做\n\n- AgentClient 只开 outbound，不监听外网\n- 网关与 Client 之间通过 WebSocket 通信，可升级 WSS\n- 用户只能管理自己的 Agent（Token 中的 user_id 即 owner_id）\n- 页面敏感操作二次确认\n\n### 9.2 生产必须补充\n\n- **认证**：用户登录、AgentClient 接入 Token\n- **授权**：明确谁能调哪些 Agent\n- **终端授权**：敏感操作前弹窗让员工确认\n- **审计日志**：记录所有指令和响应\n- **TLS/WSS**：内网也建议启用 TLS\n- **命令沙箱**：限制 Agent 可执行的命令和访问的文件范围\n- **超时与熔断**：防止单个任务卡死或占用资源过久\n- **适配器安全**：Stdio 适配器注意命令注入，HTTP 适配器注意 localhost 访问控制\n\n## 10. 为什么这样设计\n\n| 设计选择 | 优点 | 代价 |\n|---------|------|------|\n| AgentClient 主动连网关 | 穿越 NAT/防火墙，无需开端口 | 网关是单点，需要高可用 |\n| WebSocket 全双工 | 实时、浏览器原生支持 | 连接有状态，需要心跳保活 |\n| AgentClient 内置适配器 | 本地 Agent 零侵入，形态无关 | 多一层本地进程 |\n| 本地 Agent 用 HTTP+SSE / stdio | 跨平台、语言无关、调试方便 | HTTP 方式多一个本地端口 |\n| 网关集中路由 | 统一管理、审计方便 | 网关性能需要随规模扩展 |\n\n这个架构在复杂度、实时性、跨平台性和对已有 Agent 的兼容性之间做了平衡，适合作为内部 Agent 管理平台的起点。\n"

    "content": "# 通信协议规范\n\n## 1. 设计原则\n\n本协议用于**用户页面、网关、终端 AgentClient、本地 Agent** 四方之间的实时通信。设计时参考了以下业界成熟方案：\n\n| 参考协议 | 借鉴点 |\n|---------|--------|\n| **JSON-RPC 2.0** | 请求/响应信封、`id` 关联、标准错误对象 |\n| **LSP (Language Server Protocol)** | 流式进度通知（`$/progress`）、部分结果（partial results） |\n| **MCP (Model Context Protocol)** | JSON-RPC 2.0 信封、能力协商、typed content |\n| **A2A (Agent2Agent)** | Agent 身份标识、任务（task）语义、多轮协作 |\n| **STOMP / MQTT** | 基于主题的发布订阅思想（用于 agent_list 广播） |\n\n注意：本协议不照搬 MCP 的工具调用模型。本地 Agent 自己就是 AI，工具调用、确认、提示等由 Agent 自行决定并通过流式消息输出；`capabilities` 仅作为描述性标签供页面展示。\n\n设计原则：\n- **基于 JSON-RPC 2.0**：信封简单、成熟、易于调试\n- **统一信封**：所有消息用同一格式，便于统一日志和审计\n- **请求可追踪**：每个请求有唯一 `id`，响应和流式 chunk 都能对应\n- **能力协商**：连接建立时交换能力，避免硬编码\n- **用户隔离**：每个 Agent 属于一个用户，用户只能管理自己的 Agent\n- **流式原生支持**：不依赖 HTTP SSE，WebSocket 内原生支持进度通知\n- **错误标准化**：错误码、错误消息、扩展数据分离\n\n## 2. 消息信封\n\n所有 WebSocket 消息都是 JSON，必须符合 JSON-RPC 2.0 基本结构。\n\n### 2.1 请求/通知\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-uuid-or-null\",\n  \"method\": \"agent.chat\",\n  \"params\": { ... }\n}\n```\n\n- `jsonrpc`: 固定为 `\"2.0\"`\n- `id`: 请求唯一标识，字符串或数字；通知（不需要响应）为 `null` 或省略\n- `method`: 方法名，点分命名空间，如 `agent.chat`、`system.heartbeat`\n- `params`: 方法参数，对象或数组，推荐对象\n\n### 2.2 成功响应\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-uuid\",\n  \"result\": { ... }\n}\n```\n\n### 2.3 错误响应\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-uuid\",\n  \"error\": {\n    \"code\": -32600,\n    \"message\": \"Invalid Request\",\n    \"data\": {\n      \"detail\": \"missing required field 'agent_id'\"\n    }\n  }\n}\n```\n\n## 3. 认证与授权\n\n### 3.1 Token 格式\n\nWebSocket 连接通过 URL Query 参数传递 Token：\n\n```\n/ws/agent?token=user:zhangsan\n/ws/admin?token=user:zhangsan\n```\n\nToken 格式：\n\n| 前缀 | 角色 | 权限 |\n|------|------|------|\n| `user:<user_id>` | 用户 | 只能看到和管理自己拥有的 Agent |\n\n无 Token 或格式错误，网关返回 `401 Unauthorized`。\n\n### 3.2 Agent 所有权\n\nAgentClient 连接时必须使用 `user:<user_id>` Token。网关从 Token 中提取 `owner_id`，Agent 注册时携带的 `owner_id` 会被忽略（防止伪造）。\n\n用户页面连接时只显示 `owner_id` 与自己 `user_id` 相同的 Agent。\n\n### 3.3 操作授权\n\n用户发送 `task.create` 时，网关会检查是否有权操作目标 Agent：\n- 只允许操作 `owner_id` 与自己 `user_id` 相同的 Agent\n- 越权操作返回 `-32004 Unauthorized`\n\n## 4. 标准错误码\n\n| 错误码 | 名称 | 说明 |\n|--------|------|------|\n| `-32700` | Parse error | JSON 解析失败 |\n| `-32600` | Invalid Request | 请求格式非法 |\n| `-32601` | Method not found | 方法不存在 |\n| `-32602` | Invalid params | 参数错误 |\n| `-32603` | Internal error | 内部错误 |\n| `-32000` | Agent not found | 目标 Agent 不在线 |\n| `-32001` | Agent timeout | Agent 响应超时 |\n| `-32002` | Task cancelled | 任务被取消 |\n| `-32003` | Local agent error | 本地 Agent 执行出错 |\n| `-32004` | Unauthorized | 未授权操作 |\n\n## 5. 命名空间与方法\n\n方法名采用 `namespace.action` 格式：\n\n| 命名空间 | 用途 |\n|---------|------|\n| `system.*` | 系统级消息（心跳、注册、状态） |\n| `agent.*` | Agent 相关（AgentClient 与网关之间） |\n| `admin.*` | 用户页面相关（页面与网关之间，命名空间保留 `admin`） |\n| `task.*` | 任务相关（创建、取消、进度） |\n\n## 6. 生命周期消息\n\n### 6.1 Agent 注册（AgentClient → Gateway）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"reg-001\",\n  \"method\": \"system.register\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"name\": \"张三的 MacBook\",\n    \"version\": \"1.0.0\",\n    \"capabilities\": [\n      {\n        \"type\": \"chat\",\n        \"name\": \"coding\",\n        \"description\": \"编码助手，可读写文件、执行命令、分析代码\"\n      }\n    ],\n    \"platform\": {\n      \"os\": \"darwin\",\n      \"arch\": \"arm64\",\n      \"hostname\": \"zhangsan-mac\"\n    }\n  }\n}\n```\n\n网关响应：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"reg-001\",\n  \"result\": {\n    \"status\": \"ok\",\n    \"server_time\": \"2026-07-07T12:00:00Z\"\n  }\n}\n```\n\n### 6.2 心跳（双向通知）\n\nAgentClient 定期发送：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"system.heartbeat\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"timestamp\": \"2026-07-07T12:00:30Z\"\n  }\n}\n```\n\n网关可选回复：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"system.heartbeat\",\n  \"params\": {\n    \"timestamp\": \"2026-07-07T12:00:30Z\"\n  }\n}\n```\n\n### 6.3 Agent 状态更新（AgentClient → Gateway）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"system.status\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"status\": \"busy\",\n    \"task_id\": \"task-001\",\n    \"message\": \"正在执行命令\"\n  }\n}\n```\n\n## 7. 用户与 Agent 交互\n\n### 7.1 用户创建任务（User → Gateway）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-001\",\n  \"method\": \"task.create\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"task_id\": \"task-001\",\n    \"type\": \"chat\",\n    \"content\": \"帮我执行一个任务\"\n  }\n}\n```\n\n### 7.2 网关转发任务给 AgentClient（Gateway → AgentClient）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-001\",\n  \"method\": \"agent.chat\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"content\": \"帮我执行一个任务\",\n    \"metadata\": {\n      \"requester\": \"user-zhangsan\",\n      \"timestamp\": \"2026-07-07T12:00:00Z\"\n    }\n  }\n}\n```\n\n### 7.3 AgentClient 立即响应已接收\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-001\",\n  \"result\": {\n    \"status\": \"accepted\",\n    \"task_id\": \"task-001\"\n  }\n}\n```\n\n### 7.4 AgentClient 上报进度（流式）\n\n参考 LSP 的 `$/progress`，AgentClient 发送进度通知。`value.content` 推荐采用 typed content 数组，与本地 Agent 的 `stream.chunk` 保持一致：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"$/progress\",\n  \"params\": {\n    \"token\": \"task-001\",\n    \"value\": {\n      \"kind\": \"report\",\n      \"agent_id\": \"demo-mac\",\n      \"session_id\": \"session-001\",\n      \"content\": [{\"type\": \"text\", \"text\": \"正在分析\"}],\n      \"percentage\": 10\n    }\n  }\n}\n```\n\n最终完成时：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"$/progress\",\n  \"params\": {\n    \"token\": \"task-001\",\n    \"value\": {\n      \"kind\": \"end\",\n      \"agent_id\": \"demo-mac\",\n      \"session_id\": \"session-001\",\n      \"content\": [{\"type\": \"text\", \"text\": \"任务执行完成\"}],\n      \"done\": true\n    }\n  }\n}\n```\n\n### 7.5 网关转发给用户页面（Gateway → User page）\n\n网关把 `$/progress` 转发给用户页面，`content` 保持 typed content 数组：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"admin.task.progress\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"agent_id\": \"demo-mac\",\n    \"session_id\": \"session-001\",\n    \"content\": [{\"type\": \"text\", \"text\": \"正在分析\"}],\n    \"percentage\": 10,\n    \"done\": false\n  }\n}\n```\n\n### 7.6 任务完成响应\n\n如果任务最终需要返回结构化结果：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-001\",\n  \"result\": {\n    \"task_id\": \"task-001\",\n    \"status\": \"completed\",\n    \"summary\": \"任务执行完成\"\n  }\n}\n```\n\n### 7.7 用户回复确认或输入（User → Gateway）\n\n当本地 Agent 返回 `confirm_required` 或 `prompt_required` 时，页面让用户回复：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-003\",\n  \"method\": \"task.respond\",\n  \"params\": {\n    \"agent_id\": \"demo-mac\",\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"confirm_id\": \"c-001\",\n    \"response\": \"确认\"\n  }\n}\n```\n\n网关转发给 AgentClient：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-003\",\n  \"method\": \"agent.respond\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"confirm_id\": \"c-001\",\n    \"response\": \"确认\"\n  }\n}\n```\n\nAgentClient 通过适配器把回复交给本地 Agent，本地 Agent 继续执行。\n\n## 8. 任务取消\n\n### 8.1 用户取消任务（User → Gateway）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-002\",\n  \"method\": \"task.cancel\",\n  \"params\": {\n    \"task_id\": \"task-001\"\n  }\n}\n```\n\n### 8.2 网关转发取消（Gateway → AgentClient）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-002\",\n  \"method\": \"agent.cancel\",\n  \"params\": {\n    \"task_id\": \"task-001\"\n  }\n}\n```\n\n### 8.3 取消完成\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-002\",\n  \"result\": {\n    \"task_id\": \"task-001\",\n    \"status\": \"cancelled\"\n  }\n}\n```\n\n## 9. Agent 列表广播\n\n### 9.1 网关广播在线 Agent（Gateway → User page）\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"admin.agentList\",\n  \"params\": {\n    \"agents\": [\n      {\n        \"id\": \"demo-mac\",\n        \"name\": \"张三的 MacBook\",\n        \"status\": \"online\",\n        \"capabilities\": [\n          {\"type\": \"chat\", \"name\": \"coding\", \"description\": \"编码助手\"}\n        ],\n        \"platform\": {\"os\": \"darwin\", \"arch\": \"arm64\"}\n      }\n    ]\n  }\n}\n```\n\n### 9.2 Agent 事件通知\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"admin.agent.event\",\n  \"params\": {\n    \"event\": \"offline\",\n    \"agent_id\": \"demo-mac\",\n    \"timestamp\": \"2026-07-07T12:05:00Z\"\n  }\n}\n```\n\n事件类型：`online`、`offline`、`status_changed`、`capability_changed`\n\n## 10. AgentClient 与本地 Agent 的接口\n\n> 完整本地 Agent 接口标准见 [docs/local-agent-interface.md](local-agent-interface.md)。本文只列出最小可用子集。\n\nAgentClient 通过**适配器**与本地 Agent 通信。适配器屏蔽了本地 Agent 的具体形态，上层网关协议保持一致。\n\n### 10.1 通用消息格式\n\nAgentClient 发给本地 Agent 的请求（`task.create` 的 `params`）：\n\n```json\n{\n  \"task_id\": \"task-001\",\n  \"session_id\": \"session-001\",\n  \"type\": \"chat\",\n  \"content\": \"帮我执行一个任务\"\n}\n```\n\n`type` 为 `chat` 表示新消息，`respond` 表示用户对确认/反问的回复。\n\n本地 Agent 返回的流式 chunk（JSON-RPC 通知）：\n\n```json\n{\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"text\", \"content\": [{\"type\": \"text\", \"text\": \"收到指令\"}]}}\n{\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"confirm_required\", \"confirm_id\": \"c-001\", \"content\": [{\"type\": \"text\", \"text\": \"确认执行 rm -rf /tmp ?\"}]}}\n{\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"prompt_required\", \"prompt_id\": \"p-001\", \"content\": [{\"type\": \"text\", \"text\": \"选择文件\"}], \"options\": [\"a.txt\", \"b.txt\"]}}\n{\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"text\", \"content\": [{\"type\": \"text\", \"text\": \"完成\"}], \"done\": true}}\n```\n\nchunk `type` 说明：\n\n| type | 含义 |\n|------|------|\n| `text` | 普通文本输出 |\n| `thinking` | 思考过程 |\n| `action` | Agent 内部动作记录（原 `tool_use`） |\n| `result` | 动作结果（原 `tool_result`） |\n| `confirm_required` | 需要用户确认 |\n| `prompt_required` | 需要用户输入/选择 |\n| `block_required` | 需要用户填写表单/复杂交互 |\n\n### 10.2 HTTP 适配器\n\n本地 Agent 暴露 HTTP 接口：\n\n```http\nGET /capabilities\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"capabilities\": [\n    {\"type\": \"chat\", \"name\": \"coding\", \"description\": \"编码助手\"}\n  ]\n}\n```\n\n```http\nPOST /tasks\nContent-Type: application/json\n\n{\n  \"task_id\": \"task-001\",\n  \"session_id\": \"session-001\",\n  \"type\": \"chat\",\n  \"content\": \"帮我执行一个任务\"\n}\n```\n\n返回 SSE（每个 `data:` 行是一条 JSON-RPC 通知）：\n\n```http\nHTTP/1.1 200 OK\nContent-Type: text/event-stream\n\ndata: {\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"text\", \"content\": [{\"type\": \"text\", \"text\": \"收到指令\"}], \"done\": false}}\n\ndata: {\"jsonrpc\": \"2.0\", \"method\": \"stream.chunk\", \"params\": {\"task_id\": \"task-001\", \"type\": \"text\", \"content\": [{\"type\": \"text\", \"text\": \"完成\"}], \"done\": true}}\n```\n\n### 10.3 Stdio 适配器\n\n本地 Agent 作为子进程启动，AgentClient 通过 stdin/stdout JSON lines 通信。\n\nAgentClient 向 stdin 写入：\n\n```text\n{\"type\":\"chat\",\"task_id\":\"task-001\",\"session_id\":\"session-001\",\"content\":\"帮我执行一个任务\"}\n```\n\n本地 Agent 向 stdout 写入 JSON-RPC 通知：\n\n```text\n{\"jsonrpc\":\"2.0\",\"method\":\"stream.chunk\",\"params\":{\"task_id\":\"task-001\",\"type\":\"text\",\"content\":[{\"type\":\"text\",\"text\":\"收到指令\"}]}}\n{\"jsonrpc\":\"2.0\",\"method\":\"stream.chunk\",\"params\":{\"task_id\":\"task-001\",\"type\":\"confirm_required\",\"confirm_id\":\"c-001\",\"content\":[{\"type\":\"text\",\"text\":\"确认执行吗？\"}]}}\n```\n\n当本地 Agent 返回 `confirm_required` 或 `prompt_required` 时，本次请求读取暂停，等待用户通过 `task.respond` 回复后继续。\n\n## 11. 消息时序图\n\n### 11.1 用户发送聊天消息\n\n```text\nUser           Gateway          AgentClient       LocalAgent\n │               │                  │                 │\n │─task.create──▶│                  │                 │\n │               │──agent.chat─────▶│                 │\n │               │◀─result:accepted─│                 │\n │               │                  │────请求─────────▶│\n │               │                  │◀────流式输出─────│\n │               │◀──$/progress─────│                 │\n │◀─admin.task.─────────────────────│                 │\n │    progress                     │                  │\n │               │                  │◀──confirm_required\n │               │◀──$/progress:confirm_required       │\n │◀─admin.task.─────────────────────│                 │\n │   progress:confirm_required     │                  │\n │─task.respond─▶│                  │                 │\n │               │──agent.respond──▶│                 │\n │               │                  │────回复─────────▶│\n │               │                  │◀────继续输出─────│\n │               │◀──$/progress─────│                 │\n │◀─admin.task.─────────────────────│                 │\n │    progress:done                │                  │\n```\n\n## 12. 与业界方案对比\n\n### 12.1 为什么不用纯 MCP？\n\nMCP 主要解决**外部 AI 调用本地工具/资源**的问题，重点是工具发现、schema 定义和外部编排。本系统中**本地 Agent 自己就是 AI**，工具调用、确认、提示等由 Agent 自行决定；远程页面只负责聊天和展示。因此本协议借鉴 MCP 的 JSON-RPC 信封和 typed content，但不使用其工具调用模型。\n\n### 12.2 为什么不用纯 JSON-RPC？\n\nJSON-RPC 2.0 本身不支持流式。本系统借鉴 LSP 的 `$/progress` 通知，在 JSON-RPC 基础上扩展了原生流式能力。\n\n### 12.3 为什么不用 A2A？\n\nA2A 还处于早期，且偏向 Agent 之间的协作。本系统当前主要是**人与 Agent 的交互**，未来 Agent 互操作时再引入 A2A 更合适。\n\n## 13. 扩展建议\n\n- **消息压缩**：大消息可启用 per-message deflate\n- **二进制数据**：文件传输建议用独立 HTTP 接口，不在 WebSocket 里传大文件\n- **鉴权字段**：在 `system.register` 和每个请求中增加 `auth.token`\n- **端到端加密**：敏感内容可在 AgentClient 与管理页面之间加密，网关只透传密文\n- **批处理**：未来可支持 JSON-RPC batch，一次发送多个请求\n"

    "content": "# 本地 Agent 接口标准\n\n## 1. 设计目标\n\n本标准定义 **AgentClient** 与 **本地 Agent** 之间的通信规范。设计时参考以下业界成熟方案：\n\n| 参考方案 | 借鉴点 |\n|---------|--------|\n| **MCP (Model Context Protocol)** | JSON-RPC 2.0 信封、`initialize` 能力协商、typed content（text/image/resource） |\n| **A2A (Agent2Agent)** | Agent Card 发现、`Task` / `Message` / `Part` / `Artifact` 数据模型、`contextId` 会话分组、SSE 流式 |\n| **LSP (Language Server Protocol)** | 流式进度通知（`$/progress`）、请求可追踪 |\n| **JSON-RPC 2.0** | 请求/响应/通知信封、`id` 关联、标准错误对象 |\n| **Rocket.Chat UI Kit / Slack Block Kit** | 结构化消息块（section、actions、input）、交互元素（button、select、text input）、`actionId` 回传 |\n\n本标准与 MCP 的关键区别：MCP 是外部 AI 调用本地工具的协议；而本场景中**本地 Agent 自己就是 AI**，外部只是聊天页面。因此能力声明是**描述性标签**（让页面知道 Agent 类型），不是可被远程调用的工具接口；工具调用、确认、提示等均由本地 Agent 自行决定并通过流式消息输出。\n\n设计原则：\n\n- **传输无关**：同一语义可映射到 HTTP+SSE、stdio JSONL、WebSocket、Unix Socket\n- **语言无关**：基于 JSON，不依赖特定语言特性\n- **能力协商**：Agent 主动声明自己的能力、Schema、权限\n- **流式原生**：任务执行结果以流式 chunk 返回\n- **双向通信**：不仅 AgentClient 可向 Agent 发任务，Agent 也可主动上报状态、事件、能力更新\n- **会话可追踪**：每个任务有唯一 `task_id`，每次连续对话有唯一 `session_id`\n\n## 2. 传输层绑定\n\n### 2.1 HTTP + SSE\n\n**适用场景**：本地 Agent 是常驻 HTTP 服务（Python/FastAPI/Go/Node.js 等）。\n\n- AgentClient 通过 `GET /capabilities` 发现能力（返回描述性标签，见 5.2 注册消息结构）\n- AgentClient 通过 `POST /tasks` 下发任务；请求体即 `task.create` 的 `params`\n- Agent 通过 `text/event-stream` 返回流式结果，每个 `data:` 行是一条 JSON-RPC 通知（如 `stream.chunk`）\n- 可选 `GET /health` 健康检查\n\n对于持久连接（如 WebSocket 或长连接 SSE），连接建立后需先进行 `lifecycle.initialize` 能力协商；单次 HTTP 调用场景可通过 `GET /capabilities` 完成静态发现。\n\n> 注意：本协议不暴露可被外部调用的工具接口。本地 Agent 自行决定何时调用工具、何时请求用户确认；这些决策结果通过 `stream.chunk` 的各种 `type` 输出给页面展示。\n\n优点：跨平台、语言无关、调试方便、可独立升级。\n\n### 2.2 Stdio JSON Lines\n\n**适用场景**：本地 Agent 是命令行交互式程序（Claude Code 类 Agent）。\n\n- AgentClient 将 Agent 作为子进程启动\n- **连接建立后，AgentClient 先发送 `lifecycle.initialize`**，Agent 响应能力集合，随后 AgentClient 发送 `lifecycle.initialized` 通知\n- AgentClient 向 Agent 的 stdin 写入 JSON 行（请求/通知）\n- Agent 向 stdout 写入 JSON 行（响应/通知）\n- stderr 可用于日志，AgentClient 可选择性收集\n\n优点：无需端口、启动即连、适合已有 CLI 工具。\n\n### 2.3 WebSocket（可选）\n\n**适用场景**：本地 Agent 本身支持 WebSocket（如 Electron 应用内部服务）。\n\n- AgentClient 作为 WebSocket 客户端连接本地 Agent\n- 双向 JSON 消息\n\n优点：真正的全双工，Agent 可随时主动推送。\n\n### 2.4 传输选择建议\n\n| Agent 形态 | 推荐传输 |\n|-----------|---------|\n| HTTP 服务 | HTTP + SSE |\n| 命令行程序 | Stdio JSONL |\n| Electron/GUI | HTTP + SSE 或 WebSocket |\n| 长驻后台进程 | HTTP + SSE 或 WebSocket |\n\n## 3. 消息信封\n\n所有消息为 JSON，**必须**采用 JSON-RPC 2.0 基本结构。连接建立后，AgentClient 必须先发送 `lifecycle.initialize` 进行能力协商；协商完成后本地 Agent 再发送 `lifecycle.register` 完成注册（与 MCP 的 `initialize` → `notifications/initialized` → 正常运行流程对齐）。\n\n- 请求/响应必须携带 `id`；通知（不需要响应）的 `id` 为 `null` 或省略。\n- 双方只能使用对方在 `capabilities` 中声明过的能力。\n\n### 3.1 请求/通知\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-uuid-or-null\",\n  \"method\": \"task.create\",\n  \"params\": { ... }\n}\n```\n\n### 3.2 响应\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-uuid\",\n  \"result\": { ... }\n}\n```\n\n### 3.3 错误\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-uuid\",\n  \"error\": {\n    \"code\": -32602,\n    \"message\": \"Invalid params\",\n    \"data\": { \"detail\": \"missing required field 'task_id'\" }\n  }\n}\n```\n\n## 4. 命名空间与方法\n\n方法名采用 `domain.action` 格式：\n\n| 命名空间 | 用途 |\n|---------|------|\n| `lifecycle.*` | 注册、心跳、状态、能力更新 |\n| `task.*` | 任务创建、回复、取消、完成 |\n| `stream.*` | 流式输出块（含 text/thinking/action/result/confirm_required/prompt_required/block_required） |\n| `event.*` | Agent 主动事件 |\n\n## 5. 生命周期消息\n\n### 5.1 初始化与能力协商 (lifecycle.initialize)\n\n参考 MCP，连接建立后 AgentClient 必须先发送 `lifecycle.initialize`，双方交换协议版本与能力。本地 Agent 返回支持的能力后，AgentClient 发送 `lifecycle.initialized` 通知，正式进入正常运行。\n\n**AgentClient → Agent**\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"init-1\",\n  \"method\": \"lifecycle.initialize\",\n  \"params\": {\n    \"protocolVersion\": \"1.0.0\",\n    \"capabilities\": {\n      \"chat\": {},\n      \"tools\": { \"listChanged\": true },\n      \"streaming\": {},\n      \"confirmations\": {},\n      \"prompts\": {}\n    },\n    \"clientInfo\": {\n      \"name\": \"agent-client\",\n      \"version\": \"1.0.0\"\n    }\n  }\n}\n```\n\n**Agent → AgentClient**\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"init-1\",\n  \"result\": {\n    \"protocolVersion\": \"1.0.0\",\n    \"capabilities\": {\n      \"chat\": {},\n      \"tools\": { \"listChanged\": true },\n      \"streaming\": {},\n      \"confirmations\": {},\n      \"prompts\": {}\n    },\n    \"serverInfo\": {\n      \"name\": \"coding-agent\",\n      \"version\": \"1.2.0\"\n    }\n  }\n}\n```\n\n**AgentClient → Agent（通知，无 id）**\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"lifecycle.initialized\"\n}\n```\n\n### 5.2 Agent 注册 (lifecycle.register)\n\n初始化完成后，本地 Agent 发送注册消息，上报完整身份、能力标签、平台信息。AgentClient 将其翻译为网关 `system.register`。\n\n这里的 `capabilities` 是**描述性标签**，供页面展示和按类型过滤，不是可被远程调用的工具接口。本地 Agent 内部的工具调用、确认逻辑由它自己决定。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"lifecycle.register\",\n  \"params\": {\n    \"agent_id\": \"coding-agent\",\n    \"name\": \"代码助手\",\n    \"version\": \"1.2.0\",\n    \"description\": \"帮助用户编写、重构、审查代码\",\n    \"capabilities\": [\n      {\n        \"type\": \"chat\",\n        \"name\": \"coding\",\n        \"description\": \"编码助手，可读写文件、执行命令、分析代码\"\n      }\n    ],\n    \"platform\": {\n      \"os\": \"darwin\",\n      \"arch\": \"arm64\",\n      \"hostname\": \"zhangsan-mac\"\n    }\n  }\n}\n```\n\n### 5.3 心跳 (lifecycle.ping)\n\nAgentClient 可定期向 Agent 发送心跳，Agent 应答。\n\n```json\n// AgentClient → Agent\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"ping-1\",\n  \"method\": \"lifecycle.ping\",\n  \"params\": { \"timestamp\": \"2026-07-08T12:00:00Z\" }\n}\n\n// Agent → AgentClient\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"ping-1\",\n  \"result\": { \"status\": \"ok\", \"timestamp\": \"2026-07-08T12:00:00Z\" }\n}\n```\n\n### 5.4 状态更新 (lifecycle.status)\n\nAgent 主动上报当前状态。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"lifecycle.status\",\n  \"params\": {\n    \"status\": \"busy\",\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"message\": \"正在执行命令\"\n  }\n}\n```\n\n状态枚举：`idle`、`busy`、`error`、`offline`。\n\n### 5.5 能力更新 (lifecycle.capabilities_updated)\n\nAgent 在运行中能力发生变化时主动通知。等价于 MCP 的 `notifications/tools/list_changed` / `notifications/resources/list_changed`。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"lifecycle.capabilities_updated\",\n  \"params\": {\n    \"capabilities\": [ ... ]\n  }\n}\n```\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"lifecycle.capabilities_updated\",\n  \"params\": {\n    \"capabilities\": [ ... ]\n  }\n}\n```\n\n## 6. 任务消息\n\n### 6.1 创建任务\n\n```json\n// AgentClient → Agent\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-001\",\n  \"method\": \"task.create\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"context_id\": \"ctx-conversation-abc\",\n    \"type\": \"chat\",\n    \"content\": \"帮我重构 main.go\",\n    \"history\": [\n      { \"role\": \"user\", \"content\": \"帮我重构 main.go\" }\n    ],\n    \"reference_task_ids\": [],\n    \"requester\": \"zhangsan\",\n    \"timestamp\": \"2026-07-08T12:00:00Z\",\n    \"timeout\": 300,\n    \"metadata\": {\n      \"source\": \"web\"\n    }\n  }\n}\n\n// Agent → AgentClient\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-001\",\n  \"result\": {\n    \"task_id\": \"task-001\",\n    \"status\": \"accepted\"\n  }\n}\n```\n\n### 6.2 用户回复\n\n当 Agent 输出 `confirm_required`、`prompt_required` 或 `block_required` 后，AgentClient 将用户回复转发给 Agent。`response` 可以是字符串（确认/选择），也可以是 block 表单结果对象。\n\n```json\n// AgentClient → Agent\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-002\",\n  \"method\": \"task.respond\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"confirm_id\": \"c-001\",\n    \"response\": \"确认\"\n  }\n}\n```\n\n### 6.3 取消任务\n\n```json\n// AgentClient → Agent\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-003\",\n  \"method\": \"task.cancel\",\n  \"params\": {\n    \"task_id\": \"task-001\"\n  }\n}\n```\n\n### 6.4 任务完成\n\nAgent 主动通知任务完成。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"task.completed\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"status\": \"completed\",\n    \"summary\": \"已完成 main.go 重构\"\n  }\n}\n```\n\n## 7. 流式输出消息\n\nAgent 执行任务时，通过流式 chunk 返回进度和结果。**这些 chunk 都是本地 Agent 自己决定输出的内容形态**：普通文本、思考过程、内部动作记录、需要用户确认/输入等。远程页面只负责渲染和回传，不干预 Agent 内部决策。\n\n每个 chunk 的 `content` 字段推荐采用 **typed content** 数组（参考 MCP 内容类型），便于前端统一渲染文本、图片、资源、代码块等。\n\n### 7.1 文本块\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"type\": \"text\",\n    \"content\": [\n      { \"type\": \"text\", \"text\": \"我先看看 main.go 的结构\" }\n    ],\n    \"percentage\": 10,\n    \"done\": false\n  }\n}\n```\n\n### 7.2 思考过程\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"type\": \"thinking\",\n    \"content\": [\n      { \"type\": \"text\", \"text\": \"这个函数有点长，应该拆分...\" }\n    ]\n  }\n}\n```\n\n### 7.3 Agent 内部动作记录\n\n本地 Agent 如果希望向页面展示自己执行了某个内部动作（如读取文件、执行命令），可以输出 `action` 类型。`name` 是 Agent 内部定义的任意标识，不是协议规定的工具名，页面仅做展示。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"type\": \"action\",\n    \"name\": \"inspect_source\",\n    \"arguments\": {\n      \"path\": \"main.go\",\n      \"limit\": 50\n    }\n  }\n}\n```\n\n### 7.4 动作结果\n\n动作结果返回 typed content 数组，可包含文本、图片、资源引用等。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"type\": \"result\",\n    \"name\": \"inspect_source\",\n    \"content\": [\n      { \"type\": \"text\", \"text\": \"package main\\n...\" }\n    ]\n  }\n}\n```\n\n图片示例：\n\n```json\n{\n  \"type\": \"image\",\n  \"data\": \"iVBORw0KGgoAAAANSUhEUgAAAAE...\",\n  \"mimeType\": \"image/png\"\n}\n```\n\n资源引用示例：\n\n```json\n{\n  \"type\": \"resource\",\n  \"resource\": {\n    \"uri\": \"file:///tmp/build.log\",\n    \"mimeType\": \"text/plain\",\n    \"text\": \"build output...\"\n  }\n}\n```\n\n### 7.5 代码块\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"type\": \"code\",\n    \"language\": \"go\",\n    \"content\": [\n      { \"type\": \"text\", \"text\": \"func handleChat(...) { ... }\" }\n    ]\n  }\n}\n```\n\n### 7.6 Artifact（任务产物）\n\n参考 A2A，任务最终可产生一个或多个 Artifact（文件、图片、结构化数据）。Artifact 通过 `stream.artifact` 通知发送，可增量传输。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.artifact\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"artifact_id\": \"artifact-refactor-v1\",\n    \"name\": \"main.go\",\n    \"description\": \"重构后的 main.go\",\n    \"parts\": [\n      {\n        \"type\": \"resource\",\n        \"resource\": {\n          \"uri\": \"file:///home/user/project/main.go\",\n          \"mimeType\": \"text/x-go\",\n          \"text\": \"package main\\n...\"\n        }\n      }\n    ],\n    \"append\": false,\n    \"last_chunk\": true\n  }\n}\n```\n\n## 8. 交互型流式内容\n\n当本地 Agent 自己判断需要用户确认、输入或填写表单时，会输出交互型内容。这些不是外部协议强制 Agent 调用的接口，而是 Agent 内部决策后向页面展示的形态。\n\n交互型内容可以作为 `stream.chunk` 的一种 `type`，也可以作为独立通知 `interaction.*` 发送。推荐实现：\n\n- 简单确认/选择：`stream.chunk` with `type: \"confirm_required\"` / `\"prompt_required\"`\n- 复杂表单：`interaction.block_required` 独立通知\n\n### 8.1 确认请求\n\nAgent 决定执行敏感操作前，请求用户确认。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"type\": \"confirm_required\",\n    \"confirm_id\": \"c-001\",\n    \"title\": \"执行危险命令\",\n    \"content\": [\n      { \"type\": \"text\", \"text\": \"即将执行：rm -rf /tmp/old-builds\" }\n    ],\n    \"level\": \"dangerous\",\n    \"timeout\": 60\n  }\n}\n```\n\n`level` 枚举：`info`、`warning`、`dangerous`。\n\n### 8.2 输入/选择请求\n\nAgent 需要用户输入或选择时发送。\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"type\": \"prompt_required\",\n    \"prompt_id\": \"p-001\",\n    \"content\": [\n      { \"type\": \"text\", \"text\": \"选择要重构的函数\" }\n    ],\n    \"options\": [\"handleChat\", \"doSendMessage\", \"sendProgress\"],\n    \"allow_free_text\": true\n  }\n}\n```\n\n### 8.3 富交互块（Block Kit）\n\n参考 Rocket.Chat UI Kit / Slack Block Kit，当简单文本/按钮不足以表达交互时，Agent 可返回结构化 block。前端按 block 类型渲染，用户操作后通过 `task.respond` 回传（`response` 中携带 block 结果）。\n\n**Agent → AgentClient**\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"stream.chunk\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"type\": \"block_required\",\n    \"block_id\": \"b-001\",\n    \"blocks\": [\n      {\n        \"type\": \"section\",\n        \"text\": { \"type\": \"mrkdwn\", \"text\": \"请确认部署参数\" }\n      },\n      {\n        \"type\": \"input\",\n        \"block_id\": \"env-block\",\n        \"element\": {\n          \"type\": \"static_select\",\n          \"action_id\": \"select-env\",\n          \"placeholder\": \"选择环境\",\n          \"options\": [\n            { \"text\": \"测试\", \"value\": \"test\" },\n            { \"text\": \"生产\", \"value\": \"prod\" }\n          ]\n        },\n        \"label\": { \"type\": \"plain_text\", \"text\": \"环境\" }\n      },\n      {\n        \"type\": \"actions\",\n        \"elements\": [\n          {\n            \"type\": \"button\",\n            \"action_id\": \"confirm-deploy\",\n            \"text\": \"确认部署\",\n            \"style\": \"danger\",\n            \"value\": \"deploy\"\n          },\n          {\n            \"type\": \"button\",\n            \"action_id\": \"cancel-deploy\",\n            \"text\": \"取消\",\n            \"value\": \"cancel\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\n**AgentClient → Agent：用户提交 block 操作**\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"req-004\",\n  \"method\": \"task.respond\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"session_id\": \"session-001\",\n    \"block_id\": \"b-001\",\n    \"action_id\": \"confirm-deploy\",\n    \"response\": {\n      \"env-block\": { \"select-env\": \"prod\" }\n    }\n  }\n}\n```\n\n## 9. 事件消息\n\nAgent 主动通知非任务相关事件。\n\n### 9.1 通知\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"event.notification\",\n  \"params\": {\n    \"level\": \"warning\",\n    \"title\": \"磁盘空间不足\",\n    \"content\": \"D 盘剩余空间不足 1GB\"\n  }\n}\n```\n\n### 9.2 错误\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": null,\n  \"method\": \"event.error\",\n  \"params\": {\n    \"task_id\": \"task-001\",\n    \"code\": \"LOCAL_AGENT_ERROR\",\n    \"message\": \"命令执行失败：权限不足\",\n    \"recoverable\": false\n  }\n}\n```\n\n## 10. 错误码\n\n| 错误码 | 名称 | 说明 |\n|--------|------|------|\n| `-32700` | Parse error | JSON 解析失败 |\n| `-32600` | Invalid Request | 请求格式非法 |\n| `-32601` | Method not found | 方法不存在 |\n| `-32602` | Invalid params | 参数错误 |\n| `-32603` | Internal error | 内部错误 |\n| `-32000` | Task not found | 目标 Task 不存在 |\n| `-32001` | Task timeout | 任务执行超时 |\n| `-32002` | Task cancelled | 任务被取消 |\n| `-32003` | Local agent error | 本地 Agent 执行出错 |\n| `-32004` | Capability not supported | 能力不支持 |\n| `-32005` | Confirmation denied | 用户拒绝确认 |\n\n## 11. 能力声明规范\n\n本协议中 `capabilities` 是**描述性标签**，不是可被远程调用的工具接口。本地 Agent 自己决定何时调用内部工具、何时请求用户确认；能力标签只供页面展示和按类型过滤。\n\n```json\n{\n  \"type\": \"chat\",\n  \"name\": \"coding\",\n  \"description\": \"编码助手，可读写文件、执行命令、分析代码\"\n}\n```\n\n字段说明：\n\n| 字段 | 必填 | 说明 |\n|------|------|------|\n| `type` | 是 | `chat`、`resource`、`system` 等，用于页面分类 |\n| `name` | 是 | 能力唯一标识，如 `coding`、`oncall`、`office` |\n| `description` | 是 | 人类可读的能力描述 |\n| `metadata` | 否 | 扩展字段，如 `icon`、`category`、`features` |\n\n`type` 建议取值：\n\n| 值 | 含义 |\n|----|------|\n| `chat` | 对话型 Agent |\n| `resource` | 可提供文件/数据资源 |\n| `system` | 系统管理型 Agent |\n\n> 为什么不定义 `inputSchema`？因为外部不是 AI 编排器，不需要替 Agent 决定调用哪个工具。工具调用、参数填充、确认逻辑全部由本地 Agent 自行处理。\n\n## 12. 会话与上下文\n\n- `context_id`：参考 A2A，逻辑上把多个相关 Task / Message 归为一组。同一 `context_id` 下 Agent 可维护长期上下文，用户可基于历史 Task 做追问或 refinement。\n- `session_id`：标识一次连续对话，同一 session 内 Agent 可维护上下文。\n- `task_id`：标识一次具体任务，一个 session 可包含多个 task。\n- `history`：携带历史消息/回合，Agent 可选择性使用。\n- `reference_task_ids`：引用之前的 Task，用于基于旧产物做 refinement（参考 A2A `referenceTaskIds`）。\n\n## 13. 安全建议\n\n- **输入校验**：AgentClient 应对 Agent 返回的 JSON 做基本校验\n- **危险操作确认**：本地 Agent 自己判断操作是否需要用户确认，并通过 `confirm_required` 输出；AgentClient 不应代替 Agent 做此判断\n- **超时控制**：每个 task 应设置超时，防止挂死\n- **沙箱限制**：生产环境应对 Agent 可执行命令、访问路径做限制\n- **传输安全**：HTTP 适配器建议只绑定 `127.0.0.1`，避免外部访问\n- **命令注入防护**：Stdio 适配器避免把用户输入直接拼接到命令行\n\n## 14. 与网关协议的映射\n\n本标准定义的是 AgentClient ↔ 本地 Agent 之间的协议。AgentClient 需要将其映射为网关协议：\n\n| 本地 Agent 消息 | 网关消息 |\n|----------------|---------|\n| `lifecycle.initialize` / `lifecycle.initialized` | 网关层不感知，由 AgentClient 本地处理 |\n| `lifecycle.register` | `system.register` |\n| `lifecycle.status` | `system.status` |\n| `lifecycle.capabilities_updated` | `system.capabilities_updated`（网关广播 `admin.agent.event` / `admin.agentList`） |\n| `stream.chunk` (text/thinking/action/result/confirm_required/prompt_required/block_required) | `$/progress` |\n| `stream.artifact` | `admin.task.progress`（type=artifact）或 `admin.task.artifact` |\n| `task.respond` | `agent.respond` |\n| `task.completed` | `admin.task.progress` (done=true) + 可选 `result` |\n| `event.error` | `admin.task.progress` (error) 或 JSON-RPC error |\n\nAgentClient 是这两套协议之间的翻译层。\n\n## 15. 演进路线\n\n| 阶段 | 建议实现 |\n|------|---------|\n| Demo | `lifecycle.initialize` + `task.create` + `stream.chunk`（text + confirm_required） |\n| MVP | 加上 `lifecycle.register` + `lifecycle.status` + `task.cancel` |\n| 生产 | 加上心跳、能力更新通知、取消、错误处理、超时、审计、输入校验、typed content |\n| 高级 | 加上 Artifact 流式产物、Block Kit 交互、多模态（图片/资源）、文件传输、端到端加密 |\n"
  },

    "content": "# 部署指南\n\n## 1. 部署前准备\n\n### 1.1 确认目标平台\n\n| 平台 | 常见 CPU 架构 | Go 构建参数 |\n|------|--------------|------------|\n| Windows 10/11 | amd64 | `GOOS=windows GOARCH=amd64` |\n| Windows 7 | amd64 | **需 Go 1.20 或更早** |\n| Linux x64 | amd64 | `GOOS=linux GOARCH=amd64` |\n| 麒麟桌面（飞腾/鲲鹏） | arm64 | `GOOS=linux GOARCH=arm64` |\n| 麒麟桌面（x86） | amd64 | `GOOS=linux GOARCH=amd64` |\n| 麒麟桌面（龙芯） | loong64 | `GOOS=linux GOARCH=loong64` |\n| macOS Intel | amd64 | `GOOS=darwin GOARCH=amd64` |\n| macOS Apple Silicon | arm64 | `GOOS=darwin GOARCH=arm64` |\n\n### 1.2 网络要求\n\n- 终端必须能访问网关的内网地址和端口\n- 网关不需要访问终端，只需要监听端口\n- 所有通信建议走 HTTPS/WSS（生产环境）\n\n## 2. 构建二进制\n\n### 2.1 使用构建脚本（推荐）\n\n```bash\n./scripts/build.sh\n```\n\n输出到 `dist/` 目录。\n\n如果 `go` 不在 PATH 中：\n\n```bash\nGO=/usr/local/go/bin/go ./scripts/build.sh\n```\n\n### 2.2 手动构建\n\n```bash\n# Windows x64\nGOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/client-windows.exe ./cmd/client\nGOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/gateway-windows.exe ./cmd/gateway\n\n# Linux x64\nGOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/client-linux ./cmd/client\nGOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/gateway-linux ./cmd/gateway\n\n# Linux arm64（麒麟飞腾/鲲鹏）\nGOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/client-kylin-arm64 ./cmd/client\nGOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/gateway-kylin-arm64 ./cmd/gateway\n```\n\n### 2.3 Windows 7 特殊说明\n\nGo 1.21 起不再支持 Windows 7。如需兼容 Win7：\n\n```bash\n# 使用 Go 1.20 构建\n/path/to/go1.20/bin/go build -o dist/client-win7.exe ./cmd/client\n```\n\n## 3. 网关部署\n\n### 3.1 Linux 服务器部署\n\n```bash\n# 上传二进制到服务器\nscp dist/gateway-linux-amd64 user@gateway-server:/opt/agent-manage/\n\n# 启动\n/opt/agent-manage/gateway-linux-amd64 -addr 0.0.0.0:8080\n```\n\n### 3.2 使用 systemd 管理（推荐）\n\n创建 `/etc/systemd/system/agent-gateway.service`：\n\n```ini\n[Unit]\nDescription=Agent Manage Gateway\nAfter=network.target\n\n[Service]\nType=simple\nExecStart=/opt/agent-manage/gateway-linux-amd64 -addr 0.0.0.0:8080\nRestart=always\nRestartSec=5\nUser=agent\nGroup=agent\nWorkingDirectory=/opt/agent-manage\n\n[Install]\nWantedBy=multi-user.target\n```\n\n启动：\n\n```bash\nsudo systemctl daemon-reload\nsudo systemctl enable agent-gateway\nsudo systemctl start agent-gateway\n```\n\n### 3.3 使用 Nginx 反向代理（可选）\n\n如果需要 HTTPS 或域名：\n\n```nginx\nserver {\n    listen 80;\n    server_name gateway.internal;\n\n    location / {\n        proxy_pass http://127.0.0.1:8080;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n}\n```\n\n**注意**：WebSocket 必须配置 `Upgrade` 和 `Connection` 头。\n\n## 4. 终端 Client 部署\n\n### 4.1 Windows 部署\n\n#### 方式一：命令行启动\n\n```powershell\n# HTTP 型本地 Agent\nclient-windows-amd64.exe `\n  -adapter http `\n  -gateway ws://gateway.internal:8080/ws/agent `\n  -agent-id PC-ZHANGSAN `\n  -local-agent http://localhost:9001 `\n  -token user:zhangsan\n\n# 命令行型本地 Agent（如 Claude Code 类 Agent）\nclient-windows-amd64.exe `\n  -adapter stdio `\n  -gateway ws://gateway.internal:8080/ws/agent `\n  -agent-id PC-ZHANGSAN `\n  -local-agent \"C:\\Program Files\\MyAgent\\agent.exe\" `\n  -token user:zhangsan\n```\n\n#### 方式二：注册为 Windows 服务（推荐）\n\n使用 `nssm`（Non-Sucking Service Manager）：\n\n```powershell\nnssm install AgentClient\n# 在弹出的窗口中：\n# Path: C:\\Program Files\\AgentManage\\client-windows-amd64.exe\n# Startup directory: C:\\Program Files\\AgentManage\n# Arguments: -adapter http -gateway ws://gateway.internal:8080/ws/agent -agent-id PC-ZHANGSAN -local-agent http://localhost:9001 -token user:zhangsan\n\nnssm start AgentClient\n```\n\n### 4.2 Linux / 麒麟部署\n\n```bash\n# 上传二进制\nscp dist/client-linux-amd64 user@terminal:/opt/agent-manage/client\n\n# HTTP 型本地 Agent\n/opt/agent-manage/client \\\n  -adapter http \\\n  -gateway ws://gateway.internal:8080/ws/agent \\\n  -agent-id kylin-zhangsan \\\n  -local-agent http://localhost:9001 \\\n  -token user:zhangsan\n\n# Stdio 型本地 Agent\n/opt/agent-manage/client \\\n  -adapter stdio \\\n  -gateway ws://gateway.internal:8080/ws/agent \\\n  -agent-id kylin-zhangsan \\\n  -local-agent \"/opt/my-agent/bin/agent\" \\\n  -token user:zhangsan\n```\n\n#### 使用 systemd\n\n创建 `/etc/systemd/system/agent-client.service`：\n\n```ini\n[Unit]\nDescription=Agent Client\nAfter=network.target\n\n[Service]\nType=simple\nExecStart=/opt/agent-manage/client \\\n  -adapter http \\\n  -gateway ws://gateway.internal:8080/ws/agent \\\n  -agent-id kylin-zhangsan \\\n  -local-agent http://localhost:9001 \\\n  -token user:zhangsan\nRestart=always\nRestartSec=5\nUser=zhangsan\nGroup=zhangsan\n\n[Install]\nWantedBy=multi-user.target\n```\n\n启动：\n\n```bash\nsudo systemctl daemon-reload\nsudo systemctl enable agent-client\nsudo systemctl start agent-client\n```\n\n### 4.3 macOS 部署\n\n```bash\n# HTTP 型本地 Agent\n./client-darwin-arm64 \\\n  -adapter http \\\n  -gateway ws://gateway.internal:8080/ws/agent \\\n  -agent-id mac-zhangsan \\\n  -local-agent http://localhost:9001 \\\n  -token user:zhangsan\n\n# Stdio 型本地 Agent\n./client-darwin-arm64 \\\n  -adapter stdio \\\n  -gateway ws://gateway.internal:8080/ws/agent \\\n  -agent-id mac-zhangsan \\\n  -local-agent \"/opt/my-agent/bin/agent\" \\\n  -token user:zhangsan\n```\n\n使用 `launchd` 后台运行：\n\n创建 `~/Library/LaunchAgents/com.agent.client.plist`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n    <key>Label</key>\n    <string>com.agent.client</string>\n    <key>ProgramArguments</key>\n    <array>\n        <string>/opt/agent-manage/client</string>\n        <string>-adapter</string>\n        <string>http</string>\n        <string>-gateway</string>\n        <string>ws://gateway.internal:8080/ws/agent</string>\n        <string>-agent-id</string>\n        <string>mac-zhangsan</string>\n        <string>-local-agent</string>\n        <string>http://localhost:9001</string>\n        <string>-token</string>\n        <string>user:zhangsan</string>\n    </array>\n    <key>KeepAlive</key>\n    <true/>\n    <key>RunAtLoad</key>\n    <true/>\n</dict>\n</plist>\n```\n\n加载：\n\n```bash\nlaunchctl load ~/Library/LaunchAgents/com.agent.client.plist\n```\n\n## 5. 本地 Agent 部署\n\n本地 Agent 需要与 AgentClient 同机运行，暴露 HTTP 服务。\n\n### 5.1 使用 Demo 本地 Agent\n\n```bash\n# Windows\nlocal-agent-windows-amd64.exe -addr :9001\n\n# Linux/麒麟\n./local-agent-linux-amd64 -addr :9001\n```\n\n### 5.2 接入真实 Agent\n\n只要真实 Agent 提供以下接口，AgentClient 就可以调用：\n\n```http\nGET /capabilities\nResponse:\n{\n  \"capabilities\": [\n    {\"type\": \"chat\", \"name\": \"coding\", \"description\": \"编码助手\"}\n  ]\n}\n\nPOST /tasks\nRequest Body: {\"task_id\": \"...\", \"session_id\": \"...\", \"type\": \"chat\", \"content\": \"...\"}\nResponse: text/event-stream\n```\n\nSSE 响应格式（每个 `data:` 行是一条 JSON-RPC 通知，type 由 Agent 自行定义）：\n\n```\ndata: {\"jsonrpc\":\"2.0\",\"method\":\"stream.chunk\",\"params\":{\"task_id\":\"...\",\"type\":\"text\",\"content\":[{\"type\":\"text\",\"text\":\"收到指令\"}],\"done\":false}}\ndata: {\"jsonrpc\":\"2.0\",\"method\":\"stream.chunk\",\"params\":{\"task_id\":\"...\",\"type\":\"confirm_required\",\"confirm_id\":\"c-1\",\"content\":[{\"type\":\"text\",\"text\":\"确认执行？\"}]}}\ndata: {\"jsonrpc\":\"2.0\",\"method\":\"stream.chunk\",\"params\":{\"task_id\":\"...\",\"type\":\"text\",\"content\":[{\"type\":\"text\",\"text\":\"完成\"}],\"done\":true}}\n```\n\n## 6. 配置参数说明\n\n### gateway\n\n| 参数 | 说明 | 默认值 |\n|------|------|--------|\n| `-addr` | 监听地址 | `:8080` |\n\n### client\n\n| 参数 | 说明 | 默认值 |\n|------|------|--------|\n| `-gateway` | 网关 WebSocket URL | `ws://localhost:8080/ws/agent` |\n| `-agent-id` | Agent 唯一标识 | 主机名 |\n| `-adapter` | 本地 Agent 适配器类型：`http` 或 `stdio` | `http` |\n| `-local-agent` | 本地 Agent HTTP 地址或命令路径 | `http://localhost:9001` |\n| `-token` | 用户 Token，格式 `user:<user_id>` | `user:default` |\n\n### local-agent\n\n| 参数 | 说明 | 默认值 |\n|------|------|--------|\n| `-addr` | 监听地址 | `:9001` |\n\n## 7. 常见问题\n\n### 7.1 终端 Client 连不上网关\n\n检查：\n- 终端能否 `ping gateway.internal`\n- 终端能否 `curl http://gateway.internal:8080`\n- 防火墙是否放行终端到网关的出站连接\n- 网关是否监听 `0.0.0.0` 而不是 `127.0.0.1`\n\n### 7.2 用户页面不显示 Agent\n\n检查：\n- Client 是否启动成功\n- Client 日志是否显示 `registered as xxx`\n- 浏览器控制台是否有 WebSocket 报错\n- 网关和 Client 之间网络是否连通\n\n### 7.3 发消息后无响应\n\n检查：\n- 本地 Agent 是否启动（`curl http://localhost:9001/capabilities`）\n- Client 日志是否有错误\n- 本地 Agent 是否正确返回 SSE 格式\n\n### 7.4 Windows 7 无法运行\n\n如果报错缺少系统 API 或无法启动，可能是用高版本 Go 构建的。请使用 Go 1.20 重新构建。\n\n## 8. 生产部署 checklist\n\n- [ ] 网关部署在稳定的内网服务器，配置 systemd 自启\n- [ ] 启用 HTTPS/WSS\n- [ ] 配置用户认证和 Agent 接入 Token\n- [ ] 终端 Client 配置为系统服务开机自启\n- [ ] 本地 Agent 有异常退出自动重启机制\n- [ ] 配置审计日志落盘或入库\n- [ ] 敏感操作需要终端用户二次确认\n- [ ] 限制 Agent 可执行命令和访问路径\n"

    "content": "# ywcoder 接入管控台 —— 技术方案与字段级映射\n\n> 目标：把 ywcoder-cli 接入管控台，扮演协议中的「本地 Agent」，通过 AgentClient 的 Stdio 适配器接入网关。\n> 前置阅读：[architecture.md](architecture.md)、[protocol.md](protocol.md)、[local-agent-interface.md](local-agent-interface.md)。\n> 本文所有协议行为均已对 ywcoder v1.2.4（`dist/cli.mjs`）实测验证，依据见 §16。\n\n## 0. 方案概述\n\nywcoder 内置 Claude Agent SDK 的 `--output-format stream-json` 无头模式：一个上游维护、全保真的 JSONL 事件流协议，自带权限控制面（control protocol）、多轮输入、增量输出、会话续接、usage、中断。\n\n因此接入方案是：**不改 ywcoder 源码，用现成 stream-json 模式 + 一层薄翻译 shim**。shim 对上说管控台协议、对下扮演 SDK client，只做两套协议的纯映射。整个接入退化为「一个伴生翻译进程 + 正确的启动参数」。\n\n| 复用面 | 信封 | 权限控制面 | 保真度 | ywcoder 改动 | 采用 |\n|---|---|---|---|---|---|\n| gRPC server | 自定义 protobuf | 无（每工具粗暴弹窗） | 仅 text+tool | 已有 | 否（AgentClient 无 gRPC 适配器） |\n| **stream-json + shim** | **SDK 原生 schema** | **control protocol** | **全** | **零** | **是** |\n\n## 1. 总体架构\n\n```text\n网关 ──WS──► AgentClient(通用 Stdio JSONL 适配器) ──stdin/stdout JSONL(本地-agent 协议)──► ywmatrix-shim\n   (管控台侧，Node)   外连/心跳/重连/spawn 托管                                        │  spawn 子进程\n                                                                                     │  stdin/stdout JSONL(SDK stream-json)\n                                                                                     ▼\n                                                            ywcoder -p --output-format stream-json ...\n```\n\n**职责划分（已定）：**\n- **AgentClient**（管控台侧，Node，**通用 Stdio JSONL 适配器**，为适配多种 agent 而通用）：负责外连网关、心跳、重连，并 **spawn + 托管**本地 agent，通过 stdio 说 protocol.md 的本地-agent 协议（`lifecycle.* / task.* / stream.chunk`）。连接层不是我们的事。\n- **shim**（ywcoder 侧，**随 ywcoder 打包交付**）：就是 AgentClient spawn 的那个「本地 agent」。\n  - 对上：说本地-agent 协议（`lifecycle.* / task.* / stream.chunk`）。\n  - 对下：扮演 SDK client，用 stream-json 与 ywcoder 子进程双向通信；负责两套协议的纯映射。\n  - 维护：`session_id`、`task_id ↔ can_use_tool.request_id ↔ confirm_id` 关联表、每个 pending 权限请求的超时定时器。\n  - 用 Node 写，可 import [controlSchemas.ts](../../../src/entrypoints/sdk/controlSchemas.ts) / [coreSchemas.ts](../../../src/entrypoints/sdk/coreSchemas.ts) 做类型校验。\n\n**打包（已定）**：shim 是 **ywcoder 交付物的一部分**（作为 ywcoder-cli 包里的一个附带入口，如 `dist/shim.mjs` 或 bin `ywcoder-ywmatrix`），**ywcoder 运行时零改动**（不碰 `cli.mjs`/`main.tsx`）。用户终端安装：ywcoder（含 shim）+ AgentClient，共两件，无新增运行时（Node 本就为 ywcoder 装）。\n\n## 2. 启动参数\n\nAgentClient（通用 stdio 适配器）把 shim 当本地 Agent 拉起（已与 AgentClient 团队定，见 §17-A）：\n```json\n{\n  \"command\": \"ywcoder-ywmatrix\",\n  \"args\": [\"--workdir\", \"/path/to/project\", \"--permission-mode\", \"default\"],\n  \"cwd\": \"/path/to/project\"\n}\n```\n- AgentClient 保持通用：只透传 `command/args/cwd`，不解释 args 含义。\n- shim 的 args：`--workdir`（shim 据此设 ywcoder 的 cwd 与 `--add-dir`）、`--permission-mode`（用 ywcoder 真实取值 `default/acceptEdits/bypassPermissions`）。\n- env 整体继承 AgentClient；需 AgentClient **以正确用户身份启动**，保证 `HOME/USER/PATH` 正确（供 ywcoder 读本地配置/凭证，见 §17-B）。\n\nshim 内部据 args 用 ywcoder **真实 flag** 拉起（`--permission-mode default` 时 shim **自动补 `--permission-prompt-tool stdio`** 并启用控制面）：\n```\nywcoder -p \\\n  --input-format stream-json \\\n  --output-format stream-json \\\n  --verbose \\\n  --permission-mode default \\\n  --permission-prompt-tool stdio \\\n  [--include-partial-messages] \\\n  [--model <m>] [--fallback-model <m>] \\\n  --add-dir <workdir>\n```\n\n| 参数 | 说明 |\n|---|---|\n| `--input-format stream-json` | 多轮用户消息以 JSONL 从 stdin 注入 |\n| `--output-format stream-json` | 所有事件以 SDKMessage JSONL 从 stdout 输出——**天然保证 stdout 洁净**（无横幅/日志污染，日志走 stderr） |\n| `--verbose` | **stream-json 模式的强制前提**，缺失则 ywcoder 启动即报错退出 |\n| `--permission-prompt-tool stdio` | **完整档必需**：只有它（或 `--sdk-url`）能让工具权限走 `can_use_tool` 控制面；不加则权限由本地按 permission-mode 判定，被拒工具直接返回 `is_error` 的 tool_result，**不会**向网页发确认 |\n| `--include-partial-messages` | 可选：开启后输出 `stream_event` 增量（text/thinking/tool_use 增量）；不开则只输出完整 `assistant` 消息 |\n| `--add-dir <workdir>` | 授权工作目录 |\n\n## 3. shim 角色与握手时序\n\nstream-json 双向流上跑两类消息：**数据消息**（SDKMessage）与**控制消息**（control_request/response）。启动后的固定时序：\n\n```text\n1. shim → ywcoder   control_request{subtype:'initialize'}          （shim 主动先发）\n2. ywcoder → shim   control_response{subtype:'success', response:{commands,agents,models,output_style,account,...}}\n3. ywcoder → shim   {type:'system', subtype:'init', session_id, cwd, tools, model, permissionMode, ...}\n                    ↑ 真实 session_id 从这里取（不在 initialize response 里）\n4. shim → ywcoder   {type:'user', ...}                              （此后才能发任务）\n```\n\n- 数据方向：读 ywcoder stdout 的 SDKMessage → 翻成管控台 `stream.chunk`；管控台 `task.create` → 翻成 stdin 的 user message。\n- 控制方向：ywcoder 需要权限时发 `control_request{can_use_tool}` → shim 翻成 `confirm_required`；网页 `task.respond` → shim 回 `control_response`。\n\n## 4. 字段级映射 —— 输出方向（ywcoder SDKMessage → 管控台 stream.chunk）\n\n所有输出 chunk 回填 `task_id` / `session_id`，`content` 用 typed content 数组。\n\n| ywcoder 输出（SDKMessage） | 判定 | 管控台输出 |\n|---|---|---|\n| `{type:'system',subtype:'init',session_id,...}` | 握手后首条数据消息 | shim 记录 `session_id`；触发 `lifecycle.register`（见 §7）；不直接转发 |\n| `{type:'stream_event',event:{...content_block_delta,delta:{type:'text_delta',text}}}` | 文本增量（需开 partial） | `stream.chunk type:\"text\"`, `content:[{type:\"text\",text}]`, `done:false` |\n| `{...delta:{type:'thinking_delta',thinking}}` | 思考增量（需开 partial） | `stream.chunk type:\"thinking\"`, `content:[{type:\"text\",text:thinking}]` |\n| `{...delta:{type:'input_json_delta',partial_json}}` | 工具入参增量 | 忽略；用完整 tool_use（下行）即可 |\n| `{type:'assistant',message:{content:[{type:'tool_use',id,name,input}]}}` | 工具调用 | `stream.chunk type:\"action\"`, `name`, `arguments:input`（记录 `id→name`） |\n| `{type:'assistant',message:{content:[{type:'text',text}]}}` | 完整文本 | `stream.chunk type:\"text\"`（开了 partial 则以增量为准，见 §11 去重） |\n| `{type:'user',message:{content:[{type:'tool_result',tool_use_id,content,is_error}]}}` | 工具结果 | `stream.chunk type:\"result\"`, `name:map[tool_use_id]`, `content:[...]`；`is_error` 见 §10 |\n| `{type:'result',subtype:'success',result,usage,total_cost_usd,session_id}` | 任务成功 | 补 `stream.chunk done:true` + `task.completed`（summary=result；usage/cost 放 metadata） |\n| `{type:'result',subtype:'error_during_execution'\\|'error_max_turns'\\|'error_max_budget_usd',errors}` | 任务失败 | `event.error{code:\"LOCAL_AGENT_ERROR\",message:errors.join}` + 结束 task |\n\n> **工具由 ywcoder 自己执行**（[query.ts:1379](../../../src/query.ts#L1379) `runTools`，`canUseTool` 仅为权限门）。`assistant{tool_use}` 之后的 `user{tool_result}` 是 **ywcoder 自己产出的观测输出**，shim 收到 `tool_use` 时**只做展示翻译，绝不代为执行工具或注入 tool_result**——否则会破坏 ywcoder 内部工具状态机与 usage/计费统计。完整档下也一样：shim 回 `allow` 后由 ywcoder 执行。官方参考实现见 [sessionRunner.ts:483](../../../src/bridge/sessionRunner.ts#L483)（对 `user` 消息只观测、不注入）。\n>\n> `tool_result.content` 可能是字符串或 content block 数组（含 image/resource），可透传为对应 typed content；MVP 只处理文本。\n\n## 5. 字段级映射 —— 输入方向（管控台 task.create → ywcoder stdin）\n\n管控台 `task.create.params` → 写一条 SDK user message 到 ywcoder stdin：\n```json\n{ \"type\":\"user\",\n  \"message\":{ \"role\":\"user\", \"content\":\"<task.create.params.content>\" },\n  \"parent_tool_use_id\":null }\n```\n\n每条 `task.create` **必带 `session_id` + `task_id`**（并发多会话靠它路由，见 §9）。\n\n| 管控台字段 | shim 处理 |\n|---|---|\n| `content` | 对应 session 的 ywcoder 子进程 stdin，写 user message 的 `message.content` |\n| `session_id` | **路由键**：shim 据此找/建对应 ywcoder 子进程；首建时用 `--session-id <此 session_id>` 让 ywcoder 采用同一 id（见 §9），续接用 `--resume <session_id>` |\n| `task_id` | 回填到该 session 所有输出与控制关联；同一 session 内多个 task 串行 |\n| `context_id` | 多会话分组见 §9；MVP 可等同 session |\n| `history` | 通常无需——同一 ywcoder 会话已保上下文 |\n| `type:chat` | 新 user message；`type:respond` → §6.2 走控制面 |\n| `model` | 启动参数，或运行时 `control_request{set_model}` |\n| `timeout` | **不在 shim 处理**：任务超时由网关/AgentClient 侧统一控制（`-task-timeout`，见 §17-H，建议调至 30~60min） |\n\n## 6. 字段级映射 —— 控制面（control protocol ↔ 管控台）\n\n### 6.1 初始化握手\n\n**shim → ywcoder**（stdin，spawn 后第一件事）：\n```json\n{ \"type\":\"control_request\", \"request_id\":\"init-1\",\n  \"request\":{ \"subtype\":\"initialize\" } }\n```\n**ywcoder → shim**（stdout）：\n```json\n{ \"type\":\"control_response\", \"response\":{ \"subtype\":\"success\", \"request_id\":\"init-1\",\n  \"response\":{ \"commands\":[...], \"agents\":[...], \"models\":[...],\n               \"output_style\":\"...\", \"available_output_styles\":[...], \"account\":{...} } }}\n```\n收到 success 后 shim 进入 idle，等待管控台 `task.create`。真实 `session_id` 从随后的 `system/init` 取。\n\n### 6.2 权限确认：`can_use_tool` ↔ `confirm_required` ↔ `task.respond`\n\n**ywcoder → shim**（仅在 `--permission-prompt-tool stdio` 下、且工具需批准时发出）：\n```json\n{ \"type\":\"control_request\", \"request_id\":\"<rid>\",\n  \"request\":{ \"subtype\":\"can_use_tool\", \"tool_name\":\"Bash\",\n    \"input\":{...}, \"tool_use_id\":\"tool_...\",\n    \"permission_suggestions\":[{\"type\":\"addRules\",\"rules\":[...],\"behavior\":\"allow\",\"destination\":\"localSettings\"}],\n    \"decision_reason\":\"...\", \"title\":\"...\", \"description\":\"...\" } }\n```\n**shim → 管控台**：\n```json\n{ \"jsonrpc\":\"2.0\",\"method\":\"stream.chunk\",\"params\":{\n  \"task_id\":\"...\",\"session_id\":\"...\",\n  \"type\":\"confirm_required\",\"confirm_id\":\"<rid>\",\n  \"title\":\"执行 Bash\", \"content\":[{\"type\":\"text\",\"text\":\"<input 摘要>\"}],\n  \"level\":\"dangerous\", \"timeout\":<shim 自设> }}\n```\n**管控台 → shim**：`task.respond`\n```json\n{ \"jsonrpc\":\"2.0\",\"id\":\"...\",\"method\":\"task.respond\",\"params\":{\n  \"task_id\":\"...\",\"confirm_id\":\"<rid>\",\"response\":\"确认\" }}\n```\n**shim → ywcoder**（stdin），三种语义：\n```json\n// ① 允许本次工具\n{ \"type\":\"control_response\",\"response\":{ \"subtype\":\"success\",\"request_id\":\"<rid>\",\n  \"response\":{ \"behavior\":\"allow\", \"updatedInput\":{} } }}\n// ② 仅拒绝本次工具（模型继续对话）\n{ \"type\":\"control_response\",\"response\":{ \"subtype\":\"success\",\"request_id\":\"<rid>\",\n  \"response\":{ \"behavior\":\"deny\", \"message\":\"用户在管控台拒绝\" } }}\n// ③ 拒绝并中断整个任务\n{ \"type\":\"control_response\",\"response\":{ \"subtype\":\"success\",\"request_id\":\"<rid>\",\n  \"response\":{ \"behavior\":\"deny\", \"message\":\"用户取消任务\", \"interrupt\":true } }}\n```\n\n**allow 的两条硬约束（务必遵守）：**\n1. `updatedInput` **必填**（stdio 路径的 schema 要求）。传空对象 `{}` 表示「用原始入参」；除非管控台要改写入参，一律回 `{}`。\n2. **绝不回传 `updatedPermissions`**。`can_use_tool` 里的 `permission_suggestions` 是「把该命令永久加白名单」的建议；一旦作为 `updatedPermissions` 回传，会被 ywcoder [持久化落盘](../../../src/utils/permissions/PermissionPromptToolResultSchema.ts#L96)，使「本次允许」静默变成「永久允许」。远程场景下这是危险默认，shim 必须丢弃该建议。\n\n### 6.3 取消：`task.cancel` → `interrupt`\n\n管控台 `task.cancel`（带 `session_id`/`task_id`）→ shim 对**对应 session 的 ywcoder 子进程**发 `{type:'control_request',request_id:'<new>',request:{subtype:'interrupt'}}`（ywcoder 内部中断当前轮；必要时 kill 子进程）。\n\n> ⚠️ **已知缺口（需 AgentClient 侧修）**：当前 stdio 模式下,用户点「停止」时 AgentClient 只关闭本地 chunk 队列,**不会把取消传到 shim**——shim 与 ywcoder 子进程仍在跑,继续烧 API/token 且后续输出被静默丢弃。修法：AgentClient 停止时**补发一行 `task.cancel` 给 shim**（对齐 HTTP 模式的 abort 语义），shim 再按上面转成 `interrupt`。这条不修则「停止」是假的（见 §17-H）。\n\n## 7. lifecycle / capabilities（shim 面向管控台补齐）\n\nstream-json 无「注册」概念，由 shim 补：\n- `lifecycle.initialize`（AgentClient→shim）：shim 回固定能力集 `{chat,streaming,confirmations,prompts}` + `serverInfo{name:\"ywcoder\",version}`。\n- `lifecycle.register`（shim→AgentClient，收到 `initialized` 后主动发）：`capabilities:[{type:\"chat\",name:\"coding\",description:\"编码助手，可读写文件、执行命令、分析代码\"}]`，`platform` 用 `process.platform/arch/hostname`。\n- `lifecycle.ping` → shim 本地应答 `{status:\"ok\",timestamp}`（不透传给 ywcoder）。\n- `lifecycle.status`：任务开始/结束时 shim 主动发 `busy/idle`；ywcoder `result{error_*}` 或子进程异常时发 `error`。\n\n## 8. 权限模型与安全边界\n\n### 8.1 权限触发规则（实测）\n\n| 工具类别 | 行为 |\n|---|---|\n| 只读工具（Read/Glob/Grep 等） | 自动放行，不触发确认 |\n| 只读 Bash（如 `pwd`、`ls`） | 工作目录内自动放行 |\n| 网络 / 子 shell 类 Bash（如 `curl`、`bash -c \"...\"`） | 触发 `can_use_tool`，需确认 |\n| 删除 / 写盘类 Bash（如 `rm`、`rm -rf`、重定向写文件） | 触发 `can_use_tool`（按目标路径判定，请求带 `blocked_path`）；**allow 后真实且不可逆执行**（实测 `rm`/`rm -rf` 工作目录内外均触发确认，allow 后目标被删除） |\n| 写操作（Write/Edit） | 受 permission-mode 影响：`default` 下若无控制面则直接 `is_error` 失败；`default + stdio` 下触发确认；`acceptEdits`/`bypassPermissions` 自动放行 |\n\nBash 的判定由共享子系统完成（[bashCommandHelpers.ts](../../../src/tools/BashTool/bashCommandHelpers.ts) 拆段逐段过权限、[modeValidation.ts](../../../src/tools/BashTool/modeValidation.ts) 区分只读/需批准、[bashSecurity.ts](../../../src/tools/BashTool/bashSecurity.ts) 查注入），stream-json 与终端模式**共用同一判定核心**，只是确认交付方式不同（`can_use_tool` vs 终端 UI）。\n\n### 8.2 两档策略\n\n- **简单档（受控内网 / MVP）**：`--permission-mode acceptEdits` 或 `bypassPermissions`，shim 不实现控制面，纯做输出翻译。\n- **完整档**：`--permission-mode default --permission-prompt-tool stdio`，shim 实现 §6.2 控制面，网页二次确认。partial 可选。\n\n**档位如何指定（已定）：**\n- 通过 shim 的 **`--permission-mode` 参数**指定，取 ywcoder 真实值 `default`/`acceptEdits`/`bypassPermissions`；由 AgentClient 在 `args` 里透传（AgentClient 只转发、不解释，故通用性不破，见 §2）。\n- shim 据此派生：`default` → 追加 `--permission-prompt-tool stdio` + 启用控制面（完整档）；`acceptEdits`/`bypassPermissions` → 不启用控制面（简单档）。\n- **默认/建议值**：MVP 用 `bypassPermissions`/`acceptEdits`（先跑通）；**生产建议 `default`**——危险操作弹网页确认更安全。\n- ⚠️ **注意**：`bypassPermissions` 会**关掉全部权限门**，此时 §8.3「依赖 ywcoder 权限控制」不成立（无控制可依赖）。要靠 ywcoder 拦危险命令,必须用 `default`。\n- （可选）运行时动态切：SDK 控制面的 `set_permission_mode` control_request。\n\n### 8.3 shim/管控台侧硬约束（安全关键）\n\n1. **必须自建 Bash 命令安全策略，并慎重对待 allow**。ywcoder 默认权限对只读放行，对网络/子 shell、以及写/删除类命令（`rm`、`rm -rf`、重定向写盘等，按目标路径判定）会触发 `can_use_tool`。已实测 `rm`/`rm -rf` 确实触发确认，**且 shim 回 allow 后文件/目录被真实且不可逆删除**。因此：`confirm_required` 到网页时必须如实呈现命令与危险级别（allow 即真执行，无二次兜底）；远程被驱动场景建议在 shim/管控台层再叠加独立命令白/黑名单做纵深防御；**不能仅依赖模型自律**（模型可能自我克制、也可能直接执行）。\n2. **超时不由 shim 持有短计时器**。任务时长超时归网关（`-task-timeout`，见 §17-H）；confirm 确认**不设 shim 短超时**——人在回路本就该等人（尤其手机端/异步），快速自动 deny 会误杀正常操作。ywcoder 对 pending `can_use_tool` 虽无默认超时，但\"永久挂起\"已被 **网关 task-timeout + 手动取消**兜住（到点砍任务 → `task.cancel` → shim `interrupt`），有明确上界。若确需 confirm 级上限，设**长的、可配置的（分钟级），默认 deny**，而非 30s。前提：网关 task-timeout 生效 + stdio 取消缺口已修（§6.3）。\n3. **allow 不回传 `updatedPermissions`**（见 §6.2）。\n4. **续接不保留权限**：`--resume` 后每次工具调用仍重新确认（见 §9），不会因上次 allow 而免确认——设计上安全，但需预期确认频次。\n\n### 9.1 并发与会话路由（已定）\n\n- AgentClient 只 spawn **一个 shim 实例**，所有 `task.create` 都发给它；每条**必带 `session_id` + `task_id`**。\n- shim 维护 `session_id → ywcoder 子进程` 映射：\n  - **同一 `session_id`** 的多个 task 路由到**同一个 ywcoder 子进程内串行**；\n  - **不同 `session_id`** 各起**独立 ywcoder 子进程**，互不干扰。\n- 上对 AgentClient 是**一条多路复用的 stdio**：每行输出必带 `session_id`+`task_id`、**整行原子写**，供 AgentClient demux。\n\n### 9.2 session_id 对齐（关键，已定）\n\n管控台的 `session_id` 与 ywcoder 内部生成的 session_id 本不相同。**解决办法：首建子进程时用 `ywcoder --session-id <管控台 session_id>` 让 ywcoder 直接采用管控台的 id**。两边 id 从此一致，`--resume <管控台 session_id>` 直接可用，**无需内部映射、shim 重启也不丢**，续接可靠。\n\n`--session-id` **已实测确认**（[main.tsx:995](../../../src/main.tsx#L995)）：`-p --output-format stream-json` 下传入 `--session-id <UUID>`，`system/init.session_id` 如实回显该值；同 UUID 已存在时用 `--resume <UUID>` 正常续接、id 一致。使用约束：\n\n1. **必须是合法 UUID**（[main.tsx:1285](../../../src/main.tsx#L1285) 硬校验，否则启动即报错）→ 需确认管控台 `session_id` 为 UUID 格式（不满足则回退内部映射方案）。\n2. **该 id 本地不能已存在**（[main.tsx:1292](../../../src/main.tsx#L1292) `sessionIdExists` = 纯文件检查 `<projectDir>/<id>.jsonl`）→ shim 分支：\n   ```js\n   // shim 与 ywcoder 同包，直接复用其 sessionIdExists（零偏差）；shim 进程 cwd 须 == --workdir\n   if (sessionIdExists(id))  ywcoder --resume <id>       // 本地已有 → 续接\n   else                      ywcoder --session-id <id>   // 本地无 → 首建\n   ```\n   再加兜底：若 `--session-id` 仍报 \"already in use\"，捕获后自动改 `--resume` 重启（防竞态）。\n3. **`--session-id` 不与 `--resume`/`--continue` 混用**（[main.tsx:1276](../../../src/main.tsx#L1276)，混用需 `--fork-session`）。\n\n### 9.3 续接（实测）\n\n| 能力 | 行为 |\n|---|---|\n| 跨进程续接 | kill 原子进程 → `--resume <session_id>` 起新子进程 → 重走 initialize 握手 → 历史恢复、id 一致 |\n| `--resume` 入参 | 支持 `<session_id>`，也支持 `<jsonl 文件路径>`（跨目录续接） |\n| 续接后权限状态 | **不保留**，每次工具调用重新确认（设计上安全，需预期确认频次） |\n\n`context_id` → 多会话分组，用多子进程/`--resume` 实现；`task_id` → 回填所有输出与 `confirm_id`。\n\n## 10. 错误码映射\n\n| 情况 | 输出 |\n|---|---|\n| shim 收到非法 JSON / 未知 method | JSON-RPC `-32700` / `-32601` |\n| `task.respond`/`cancel` 的 task_id 不存在 | `-32000` |\n| 任务超时（网关 `-task-timeout`，shim 不设计时器） | 网关发 done+error=timeout → `task.cancel` 到 shim → 对应 ywcoder 子进程 `interrupt` |\n| 用户仅拒绝确认 | `control_response{deny}`，模型继续；ywcoder 产出 `is_error:true` 的 tool_result |\n| 用户中断任务 | `control_response{deny,interrupt:true}` → ywcoder `result{subtype:error_during_execution}` |\n| 工具执行失败（tool_result.is_error） | `stream.chunk type:\"result\"` 携带错误文本 |\n| `result.subtype` 为 error_* | `event.error{code:\"LOCAL_AGENT_ERROR\"}` |\n| ywcoder 子进程异常退出 | `event.error{recoverable:false}` + 上报 offline |\n\n## 11. 增量输出去重\n\n开启 `--include-partial-messages` 后，ywcoder **同时**输出 `stream_event` 增量与完整 `assistant` 消息（实测一次问答约 209 条增量 + 8 条完整）。shim 二选一：\n- **开 partial**：以 `stream_event` 增量渲染流式效果，**忽略随后的完整 `assistant`**（避免重复）；工具调用仍以完整 `assistant` 的 `tool_use` 为准。\n- **不开 partial（推荐 MVP）**：只处理完整 `assistant` 消息，逻辑最简。\n\n## 12. 备选方案（均未采用，仅存档）\n\n- **AgentClient 内置翻译**：把 §4~§6 映射写进 AgentClient。**不采用**——AgentClient 决定做**通用 Stdio JSONL 适配器**以适配多种 agent，不能塞 ywcoder 专用逻辑；翻译因此归 ywcoder 侧（shim）。\n- **ywcoder `--sdk-url` 外连 + 心跳**：ywcoder/shim 自己外连网关、维持心跳。**不采用**——等于重造 AgentClient 已有的连接/心跳/重连层，运维职责外扩，且上行要改说网关协议。\n- 当前方案：**AgentClient 通用 stdio 适配器 spawn shim，shim 随 ywcoder 打包**（见 §1）。\n\n## 13. 分阶段实施与估时\n\n里程碑与验收清单以 [shim-build-plan.md](shim-build-plan.md) 为准，概览：\n\n- **简单档 MVP（约 2~3 天）**：M1 下行封装（`ywcoderSession.ts`）→ M2 上行协议 + mock（`protocol.ts`/`mock-agentclient.ts`）→ M3 组装冒烟（`index.ts`）。\n- **完整档（+3~4 天）**：M4 权限控制面 `can_use_tool ↔ confirm_required ↔ task.respond`（allow/deny/deny+interrupt）+ 硬约束（`updatedInput:{}`、不回传 updatedPermissions、confirm 不设短超时、Bash 独立命令策略）。\n- **生产强化**：Token 透传、多进程池与路由、审计日志、跨平台打包（见 §14）、`stream.artifact`/`block_required`（高级）。\n\n## 14. 风险\n\n1. **跨平台打包（最大不确定性）**：管控台目标含麒麟 arm64/loong64、Win7。ywcoder 是 Node/Bun 产物，需实测这些平台运行时；shim 若为 Node 同此约束。必要时 `bun build --compile` 打单文件。\n2. **Bash 安全边界**：见 §8.3——写/删除/网络类命令会触发确认，但 allow 即真实（不可逆）执行；模型自律不可依赖，须自建命令策略并在网页确认时如实呈现危险级别。\n3. **多任务并发**：单个 stream-json 会话串行；并发靠多子进程 + cwd/session 隔离，shim 需进程池与路由。\n4. **schema 漂移**：stream-json 是上游契约、较稳，升级 ywcoder 后仍应回归 §4~§6 映射；shim import 官方 zod schema 可在解析层早发现不兼容。\n\n## 15. 速查对照表\n\n| 管控台协议 | ywcoder stream-json |\n|---|---|\n| `lifecycle.initialize/register/ping` | shim 本地补齐 |\n| （握手）| shim 先发 `control_request{initialize}` → ywcoder 回 `control_response` → `system/init` |\n| `task.create.content` | stdin：`{type:'user',message:{role:'user',content}}` |\n| `stream.chunk`(text/thinking) | `stream_event` 的 text_delta/thinking_delta（需 partial） |\n| `stream.chunk`(action) | assistant 消息的 `tool_use` 块 |\n| `stream.chunk`(result) | user 消息的 `tool_result` 块（ywcoder 自产） |\n| `confirm_required` | `control_request{can_use_tool}`（需 `--permission-prompt-tool stdio`） |\n| `task.respond`(允许/拒绝/取消) | `control_response{allow, updatedInput:{}}` / `{deny,message}` / `{deny,message,interrupt:true}` |\n| `task.cancel` | `control_request{interrupt}` |\n| `task.completed` | `result{subtype:success}` |\n| `event.error` | `result{subtype:error_*}` / 子进程异常 |\n\n## 16. 源码与实测依据\n\n**源码：**\n- `--verbose` 强制：[print.ts:788-794](../../../src/cli/print.ts#L788)\n- 权限路由（`stdio` 走控制面 / 无则本地判定）：[print.ts:4274](../../../src/cli/print.ts#L4274) `getCanUseToolFn`\n- initialize 请求处理：[print.ts:2864](../../../src/cli/print.ts#L2864)\n- allow 必填 updatedInput / `{}` 回退原始 / updatedPermissions 持久化：[PermissionPromptToolResultSchema.ts:44-127](../../../src/utils/permissions/PermissionPromptToolResultSchema.ts#L44)\n- deny+interrupt 实现：[PermissionPromptToolResultSchema.ts:117](../../../src/utils/permissions/PermissionPromptToolResultSchema.ts#L117)\n- 工具内部执行：[query.ts:1379](../../../src/query.ts#L1379)；参考实现：[sessionRunner.ts:483](../../../src/bridge/sessionRunner.ts#L483)\n- Bash 权限子系统：[bashCommandHelpers.ts](../../../src/tools/BashTool/bashCommandHelpers.ts)、[modeValidation.ts](../../../src/tools/BashTool/modeValidation.ts)、[bashSecurity.ts](../../../src/tools/BashTool/bashSecurity.ts)\n\n**实测覆盖**（脚本与日志见 `/Users/sijia/code/2026/test/ywmatrix-verify/`）：Read/Bash/Write/Glob 工具流程、initialize 握手、default/default+stdio/acceptEdits/bypassPermissions 权限矩阵、危险 Bash（curl/子 shell 触发确认；`rm`/`rm -rf` 工作目录内外均触发确认、allow 后真实删除）、`can_use_tool` 无超时、deny vs deny+interrupt、同进程/跨进程/JSONL 续接、多会话并发、续接不保留权限、partial 增量输出。\n\n## 17. 契约外需与管控台对齐的确认项\n\nprotocol.md 只规定「消息怎么长」；以下是它未覆盖、接入落地必须敲定的事项。多数已与 AgentClient 团队谈定：\n\n| 项 | 结论 | 状态 |\n|---|---|---|\n| A. 启动约定 | shim 以 bin `ywcoder-ywmatrix` 分发；AgentClient 通用透传 `command/args/cwd`，args = `[\"--workdir\", <dir>, \"--permission-mode\", <mode>]`；AgentClient 长驻 spawn 一个 shim 并托管/重拉；shim 据 args 用 ywcoder 真实 flag 拉起、自解析同包 ywcoder；env 整体继承，AgentClient 须以正确用户身份启动（`HOME/USER/PATH` 正确）。见 §2 | ✅ 已定 |\n| B. Provider 凭证 | 走 **ywcoder 本地配置文件**，管控台不额外下发。前提：spawn 时用户上下文/`HOME` 正确 | ✅ 已定 |\n| C. task_id/session_id | 按 local-agent-interface.md，每条 `task.create` 带 `session_id`+`task_id`。见 F 的 id 对齐 | ✅ 已定 |\n| D. 并发模型 | AgentClient 只 spawn 一个 shim,所有 task 发给它;shim 按 `session_id` 路由:同 session 串行于一个 ywcoder 子进程,不同 session 起多个子进程。见 §9.1 | ✅ 已定 |\n| E. 命令安全策略 | 管控台**不做**命令黑白名单;shim 层可选做额外过滤,默认依赖 ywcoder 权限控制。⚠️ 「依赖 ywcoder 控制」要求用 `--permission-mode default`(bypass 无控制),见 §8 | ✅ 已定 |\n| F. session_id 对齐与续接 | AgentClient 保证同一对话 `session_id` 不变、断线重连原样回传;shim 首建用 `ywcoder --session-id <管控台 session_id>` 让两边 id 一致(需管控台 id 为 UUID),续接用 `--resume`。见 §9.2/§9.3 | ✅ 已定（待确认 id 为 UUID） |\n| G. agent_id / 能力标签 | `agent_id` 由 AgentClient 定(如 `ywcoder`;多机需带 hostname 防撞);`capabilities` 由我方给默认 `{type:\"chat\",name:\"coding\"}` | ✅ 已定 |\n| H. 心跳/超时/取消 | 心跳全归 AgentClient(30s `system.heartbeat` + WS ping/pong,shim 不管)。**任务超时**:网关 `-task-timeout` 默认 5min **太短,协商调至 30~60min 固定值**(不做 task 级 timeout)。**⚠️ stdio 取消缺口必须修**:AgentClient 停止时补发 `task.cancel` 给 shim,shim 转 `interrupt`(见 §6.3),否则「停止」是假的。confirm 无人应答超时由 shim 自实现(§8.3) | ⚠️ 超时/取消待改 |\n" // pr-scan:ignore —— 生成文件，内容内嵌自 md 源文档
