    "content": "# ywmatrix-shim 构建计划（交执行 agent）\n\n> 配套设计与字段映射见 [ywcoder-integration.md](ywcoder-integration.md)。本文只讲「怎么建、建到哪、怎么验收」。\n> 本计划针对**简单档 MVP**（不含权限控制面）。完整档在里程碑 M4，另起。\n\n## 0. 前置设定（已定）\n\n- **架构（已定）**：管控台 **AgentClient = 通用 Stdio JSONL 适配器**（负责外连网关/心跳/重连/spawn 托管本地 agent）；shim 是 AgentClient spawn 的「本地 agent」，内部再 `spawn` ywcoder 子进程做翻译。连接/心跳/重连**不归我们**。\n- **形态**：shim 是被 AgentClient spawn 的独立进程，说本地-agent 协议（`lifecycle.*/task.*/stream.chunk`）；ywcoder 产物**运行时零改动**。\n- **归属/打包（已定）**：shim **随 ywcoder-cli 打包交付**——开发代码放 `src/entrypoints/ywmatrix-shim/`，Bun 构建为 `dist/ywmatrix-shim.mjs`，bin `ywcoder-ywmatrix`（详见 §2）。不碰 `cli.mjs`/`main.tsx` 运行时。用户装：ywcoder（含 shim）+ AgentClient，两件。\n- **首个里程碑**：简单档（`--permission-mode acceptEdits`，不实现 `can_use_tool` 控制面）。\n- **上行联调**：真实 AgentClient 交付状态**待确认**（见 §5）；MVP 先对 **mock AgentClient** 跑通。契约已确认 == protocol.md。\n- **可复用资产**：`/Users/sijia/code/2026/test/ywmatrix-verify/verify*.mjs` 已验证的 spawn + JSONL 读写 + 握手骨架——shim 用 TS 重写，**复用其逻辑而非直接引用这些 .mjs 文件**（那是独立测试脚本）。\n\n## 1. 现状与缺口\n\n- **下行（shim↔ywcoder）**：协议行为已全部实测（握手、字段映射、权限、续接），只差**封装成可复用代码**。\n- **上行（shim↔AgentClient，管控台 JSON-RPC）**：**从未测过**，无真实对端。MVP 阶段用 mock 顶上。\n\n## 2. 代码位置与交付物\n\n- **开发目录**：`src/entrypoints/ywmatrix-shim/`（与 cli.tsx/mcp.ts 并列的入口）。\n- **构建产物**：`dist/ywmatrix-shim.mjs` —— 在 [scripts/build.ts](../../../scripts/build.ts) 加一个构建目标，**沿用与 cli 相同的 `Bun.build({features})`**（否则 import 的 `sessionStorage`/`*Schemas` 透传 `feature()` macro 会构建失败）。\n- **bin 注册**：`package.json` 加 `\"ywcoder-ywmatrix\": \"dist/ywmatrix-shim.mjs\"`。\n- **note/feature_ywmatrix/** 只留设计文档 + 验证脚本，不放 shim 代码。\n- **零改动边界**：ywcoder 运行时（cli.mjs/main.tsx 行为）不变；仅打包层新增一个独立 entry + bin + 构建目标。\n\n| 文件（`src/entrypoints/ywmatrix-shim/`） | 职责 |\n|---|---|\n| `ywcoderSession.ts` | 下行：spawn ywcoder（`--session-id`/`--resume` 分支复用 `sessionIdExists`）、initialize 握手、`sendUser(content)`、SDKMessage 规范化 |\n| `protocol.ts` | 上行：管控台 JSON-RPC 编解码（`lifecycle.* / task.* / stream.chunk`）+ §4/§6 映射 |\n| `index.ts` | 入口：组装上下行，按 `session_id` 路由/管理多子进程，stdout 原子写 |\n| `mock-agentclient.ts` | 测试：模拟 AgentClient，通过 stdin/stdout 驱动 shim 并断言 |\n| shim 自解析 ywcoder | spawn `node <__dirname>/cli.mjs`（同 dist 目录） |\n\n## 3. 里程碑与验收\n\n### M1 — 下行封装成库（`ywcoderSession.ts`）\n- spawn `ywcoder -p --input-format stream-json --output-format stream-json --verbose --permission-mode acceptEdits --add-dir <workdir>`\n- 实现：先发 `control_request{initialize}` → 等 `control_response{success}` → 读 `system/init` 存 `session_id` → 就绪\n- `sendUser(content)` 写 stdin user message；把 stdout 的 SDKMessage 规范化为事件：`text` / `action(tool_use)` / `result(tool_result)` / `completed(result.success)` / `error(result.error_*)`\n- **约束**：只观测 `tool_result`，绝不注入/代执行工具（[ywcoder-integration.md §4](ywcoder-integration.md)）\n- **验收**：一个本地脚本调用 `ywcoderSession`，发「读取 test.txt」→ 依次拿到 `action(Read)`→`result`→`completed`，`session_id` 非空\n\n### M2 — 上行协议层 + mock（`protocol.ts` + `mock-agentclient.ts`）\n- shim 侧实现：`lifecycle.initialize`(回能力集)、`lifecycle.register`(主动发)、`lifecycle.ping`、`task.create`、`task.cancel`、输出 `stream.chunk`/`task.completed`/`event.error`\n- 字段严格按 [ywcoder-integration.md §4/§5/§7](ywcoder-integration.md) + [protocol.md](protocol.md)\n- `mock-agentclient.ts`：起 shim 子进程 → 发 `lifecycle.initialize` → 收 `register` → 发 `task.create` → 收流式 `stream.chunk` → 断言\n- **验收**：mock 发 `task.create(\"读取 test.txt 并说明内容\")`，端到端（mock→shim→ywcoder→shim→mock）收到 text+action+result+completed，`stdout` 无非协议污染（日志全走 stderr）\n\n### M3 — 组装 + 冒烟（`index.ts`）\n- 组装 M1+M2，维护 `task_id ↔ 活动会话` 关联\n- 冒烟：纯对话任务、读文件任务、同会话多轮\n- **验收清单**：\n  - [ ] 握手时序正确（shim 先发 initialize）\n  - [ ] session_id 来自 `system/init`\n  - [ ] `tool_use`→`action`、`tool_result`→`result` 映射正确、不重复\n  - [ ] `result{success}`→`task.completed`，usage 进 metadata\n  - [ ] stdout 洁净；异常/子进程退出→`event.error`\n  - [ ] 多轮上下文保持\n\n### M4 — 完整档（后续，权限控制面）\n- 启动改 `--permission-mode default --permission-prompt-tool stdio`\n- 实现 `can_use_tool`↔`confirm_required`↔`task.respond`（allow/deny/deny+interrupt，[§6.2](ywcoder-integration.md)）\n- **硬约束**：allow 回 `updatedInput:{}`、**绝不回传 updatedPermissions**、confirm **不设 shim 短超时**（靠网关 task-timeout + 取消兜底）、Bash 独立命令策略（[§8.3](ywcoder-integration.md)）\n- mock 扩展：模拟网页 allow/deny/超时\n\n## 4. 给执行 agent 的硬约束（务必遵守）\n\n1. **ywcoder 运行时零改动**：只在 `src/entrypoints/ywmatrix-shim/` 目录内工作（另加 scripts/build.ts 一个构建目标 + package.json 一个 bin），不碰 `cli.mjs`/`main.tsx` 运行时。\n2. **stdout 洁净**：shim 对 AgentClient 的 stdout 只允许协议 JSONL，所有日志走 stderr。\n3. **不代执行工具**：收 `tool_use` 只翻译成 `action`，工具由 ywcoder 自己跑。\n4. **简单档不接控制面**：M1~M3 用 `acceptEdits`，不处理 `can_use_tool`（M4 才做）。\n5. **字段以 [ywcoder-integration.md](ywcoder-integration.md) §4/§5/§6 为准**，schema 用 ywcoder 的 zod（`src/entrypoints/sdk/*Schemas.ts`）校验。\n6. 复用 `ywmatrix-verify/verify*.mjs` 的骨架，别重造 spawn/读写轮子。\n\n## 5. 对齐状态（详见 [ywcoder-integration.md §17](ywcoder-integration.md)）\n\n**已与 AgentClient 团队谈定**：启动约定（command/args:`--workdir`+`--permission-mode`/cwd）、凭证走 ywcoder 本地配置、并发路由（一个 shim + `session_id`→子进程）、命令安全策略（管控台不做黑白名单）、session_id 用 `--session-id` 对齐、agent_id 由 AgentClient 定。\n\n**仍需处理/确认**：\n1. **任务超时**：网关 `-task-timeout` 默认 5min 太短，已协商调至 **30~60min 固定值**（不做 task 级 timeout）——落实到网关+client 配置。\n2. **⚠️ stdio 取消缺口（AgentClient 侧修）**：停止时 AgentClient 需补发 `task.cancel` 给 shim，shim 转 `interrupt`（[§6.3](ywcoder-integration.md)）。否则「停止」是假的，任务继续烧成本。\n3. **确认管控台 `session_id` 为合法 UUID**（`--session-id` 对齐的前提）。\n4. **真环境联调**：确认前 M2 只对 mock 负责；AgentClient 可用后新增「M2.5 真环境联调」。\n\n## 6. 估时（简单档 M1~M3）\n\n约 2~3 天：M1 ~1d、M2 ~1d、M3 ~0.5d + 冒烟。M4 完整档另计 +3~4 天。\n"
  }

];
    let currentIndex = 0;

    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = DOCS.map((doc, i) => `
        <div class="nav-item ${i === currentIndex ? 'active' : ''}" onclick="switchDoc(${i})">
          <div class="flex items-center justify-between">
            <div class="nav-title font-semibold text-[var(--text-main)]">${doc.title}</div>
            <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300">${doc.statusLabel}</span>
          </div>
          <div class="text-xs text-[var(--text-muted)] mt-1">${doc.subtitle}</div>
        </div>
      `).join('');
    }

    function scrollToHeading(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (window.innerWidth < 1024) closeSidebar();
    }

    function switchDoc(index) {
      currentIndex = index;
      const doc = DOCS[index];
      const content = document.getElementById('content');
      content.innerHTML = marked.parse(doc.content);
      content.classList.remove('fade-in');
      void content.offsetWidth;
      content.classList.add('fade-in');

      content.querySelectorAll('h2, h3, h4').forEach((h, idx) => {
        const id = 'heading-' + index + '-' + idx;
        h.id = id;
        const anchor = document.createElement('a');
        anchor.href = '#' + id;
        anchor.className = 'anchor-link';
        anchor.innerHTML = '#';
        anchor.onclick = (e) => { e.preventDefault(); scrollToHeading(id); };
        h.appendChild(anchor);
      });

      content.querySelectorAll('pre code').forEach(block => {
        hljs.highlightElement(block);
      });

      renderTOC();
      renderNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTOC() {
      const headings = document.querySelectorAll('#content h2, #content h3, #content h4');
      const toc = document.getElementById('toc');
      if (headings.length === 0) {
        toc.innerHTML = '<div class="text-xs text-[var(--text-muted)]">暂无目录</div>';
        return;
      }
      toc.innerHTML = Array.from(headings).map(h => {
        const level = h.tagName.toLowerCase();
        const text = h.textContent.replace('#', '').trim();
        return `<div class="toc-item ${level}" onclick="scrollToHeading('${h.id}')">${text}</div>`;
      }).join('');
    }

    function toggleTheme() {
      const isDark = !document.documentElement.classList.contains('dark');
      setTheme(isDark);
    }

    function setTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      const themeLink = document.getElementById('hljs-theme');
      themeLink.href = isDark
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      const icon = document.getElementById('theme-icon');
      icon.innerHTML = isDark
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      setTheme(true);
    }

    const mobileBtn = document.getElementById('mobile-menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.add('open');
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.remove('open');
    }

    mobileBtn.onclick = openSidebar;

    renderNav();
    switchDoc(0);
  </script>
</body>
